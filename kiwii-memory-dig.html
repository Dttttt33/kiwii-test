<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwii Power — 记忆翻找</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1a0f;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  overflow: hidden; user-select: none;
}
canvas { border-radius: 12px; cursor: pointer; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10;
}
.hi {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 7px 16px; border-radius: 14px; font-size: 15px; color: #ccc;
}
.hi span { font-weight: 600; }
.hi .g { color: #7aff7a; }
.hi .y { color: #ffd700; }
#start-overlay {
  position: fixed; inset: 0; background: rgba(8,12,8,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 14px;
}
#start-overlay h1 { color: #fff; font-size: 36px; font-weight: 300; }
#start-overlay p { color: #aaa; font-size: 17px; max-width: 440px; text-align: center; line-height: 2; }
#start-overlay strong { color: #7aff7a; }
#go-btn {
  margin-top: 14px; padding: 12px 36px; font-size: 15px;
  background: #3a8a3a; color: #fff; border: none; border-radius: 24px; cursor: pointer;
}
#go-btn:active { transform: scale(0.95); }
#btm { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; z-index: 10; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>记忆翻找</h1>
  <p>记住宝物藏在哪个土堆<br>光标扫过时 <strong>空格 / 点击 = 挖</strong></p>
  <button id="go-btn">开始</button>
</div>

<div id="hud">
  <div class="hi">动作 <span class="g" id="h-mv">1/4</span></div>
  <div class="hi">Rep <span class="g" id="h-rp">0/10</span></div>
  <div class="hi">分 <span class="y" id="h-sc">0</span></div>
  <div class="hi">连击 <span class="y" id="h-cb">—</span></div>
</div>
<div id="btm">空格/点击 = 挖 · 不按 = 跳过</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(960, window.innerWidth - 20);
const H = Math.min(580, window.innerHeight - 20);
canvas.width = W; canvas.height = H;

const SLOT_COUNT = 5;
const SLOT_W = 88, SLOT_H = 96;
const SLOT_Y = H * 0.52;
const SLOT_GAP = (W - SLOT_COUNT * SLOT_W) / (SLOT_COUNT + 1);
const TOTAL_REPS = 40;
const ITEMS = ['🌱','🥕','🎃','💎','🌟','🍄','🌺','🌽','🍇','🫚'];
const TRAPS = ['🐛','💀','🪨'];

// Continuous difficulty: computed from globalRep (0-39)
function getDiff(rep) {
  const t = rep / (TOTAL_REPS - 1); // 0 to 1
  return {
    targets: t < 0.55 ? 1 : 2,
    swaps: t < 0.15 ? 0 : Math.floor(0.5 + t * 3), // starts shuffling by rep 6
    swapSpeed: Math.round(34 - t * 14), // 34 -> 20 frames
    trap: t >= 0.5,
    revealFrames: Math.round(110 - t * 70), // 110 -> 40
    speed: 1.8 + t * 1.2,               // 1.8 -> 3.0
  };
}

// State
let state = 'idle';
let globalRep = 0, score = 0, combo = 0;
let slots = [];
let targetIndices = [];
let trapIndex = -1;

let cursorX = 0, cursorDir = 1, cursorSpeed = 1.5;
let repActive = false, struck = false, repTimer = 0;

let revealTimer = 0, revealDuration = 150;
let swapQueue = [];
let currentSwap = null;

let particles = [], feedbacks = [];
let shakeX = 0, shakeY = 0;
let flashAlpha = 0, flashColor = '';
let bigText = '', bigTextAlpha = 0, bigTextColor = '';

function slotLeftX(i) { return SLOT_GAP + i * (SLOT_W + SLOT_GAP); }

function initSlots() {
  slots = [];
  for (let i = 0; i < SLOT_COUNT; i++) {
    slots.push({
      visualX: slotLeftX(i),
      item: '', isTarget: false, isTrap: false,
      dug: false, revealed: false,
      glow: 0, shakeOff: 0, arcY: 0,
    });
  }
}

function assignRound() {
  const diff = getDiff(globalRep);
  slots.forEach(s => { s.item = ''; s.isTarget = false; s.isTrap = false; s.dug = false; s.revealed = false; s.arcY = 0; });

  const indices = Array.from({length: SLOT_COUNT}, (_,i) => i).sort(() => Math.random() - 0.5);
  const pool = [...ITEMS].sort(() => Math.random() - 0.5);

  targetIndices = indices.slice(0, diff.targets);
  targetIndices.forEach((si, i) => { slots[si].isTarget = true; slots[si].item = pool[i]; });

  trapIndex = -1;
  if (diff.trap) {
    const rest = indices.filter(i => !targetIndices.includes(i));
    trapIndex = rest[0];
    slots[trapIndex].isTrap = true;
    slots[trapIndex].item = TRAPS[Math.floor(Math.random() * TRAPS.length)];
  }

  let ri = diff.targets;
  slots.forEach(s => { if (!s.item) s.item = pool[ri++ % pool.length]; });
}

function planSwaps() {
  const diff = getDiff(globalRep);
  swapQueue = [];
  for (let s = 0; s < diff.swaps; s++) {
    let a, b;
    do { a = Math.floor(Math.random()*SLOT_COUNT); b = Math.floor(Math.random()*SLOT_COUNT); } while (a === b);
    swapQueue.push({ a, b, progress: 0, speed: diff.swapSpeed });
  }
}

function startSwapSequence() {
  if (swapQueue.length === 0) { state = 'play'; startRep(); return; }
  state = 'swapping';
  doNextSwap();
}

function doNextSwap() {
  if (swapQueue.length === 0) { state = 'play'; startRep(); return; }
  currentSwap = swapQueue.shift();
  currentSwap.progress = 0;
}

function startNewRound() {
  initSlots();
  assignRound();
  const diff = getDiff(globalRep);
  cursorX = 30; cursorDir = 1;
  cursorSpeed = diff.speed;
  revealDuration = diff.revealFrames;
  struck = false; repActive = false;
  revealTimer = 0;
  state = 'reveal';
  updateHUD();
}

function startRep() { repActive = true; struck = false; repTimer = 0; }

function endRep(hitSomething) {
  repActive = false;
  globalRep++;
  updateHUD();

  if (globalRep >= TOTAL_REPS) {
    state = 'sessionDone';
  } else if (hitSomething) {
    // Hit ended this rep — go to next round immediately
    setTimeout(() => startNewRound(), 350);
  } else {
    // Missed (cursor ran out) — same round, try again next rep
    setTimeout(() => startRep(), 250);
  }
}

function strike() {
  if (state !== 'play' || !repActive || struck) return;
  struck = true;

  let hitSlot = -1;
  for (let i = 0; i < SLOT_COUNT; i++) {
    if (cursorX >= slots[i].visualX - 12 && cursorX <= slots[i].visualX + SLOT_W + 12) { hitSlot = i; break; }
  }
  if (hitSlot === -1) return;
  if (slots[hitSlot].dug) { addFeedback('已挖', slots[hitSlot].visualX+SLOT_W/2, SLOT_Y-20, '#666'); return; }

  slots[hitSlot].dug = true;
  slots[hitSlot].revealed = true;

  if (slots[hitSlot].isTarget) {
    combo++;
    const pts = 20 + combo * 15;
    score += pts;
    flashAlpha = 0.45; flashColor = combo >= 3 ? '#ffd700' : '#7aff7a';
    spawnParticles(slots[hitSlot].visualX+SLOT_W/2, SLOT_Y+20, '#7aff7a', 22);
    if (combo >= 2) spawnParticles(slots[hitSlot].visualX+SLOT_W/2, SLOT_Y, '#ffd700', 12);
    shake(6 + combo*2);
    slots[hitSlot].glow = 1.5;
    bigText = combo >= 3 ? `🔥 ×${combo} +${pts}` : `+${pts}`;
    bigTextColor = combo >= 3 ? '#ffd700' : '#7aff7a';
    bigTextAlpha = 1.3;
    addFeedback(`🎯 +${pts}`, slots[hitSlot].visualX+SLOT_W/2, SLOT_Y-40, '#7aff7a');
    // HIT — end rep immediately, new round
    endRep(true);
  } else if (slots[hitSlot].isTrap) {
    combo = 0;
    score = Math.max(0, score - 20);
    flashAlpha = 0.45; flashColor = '#ff0000';
    shake(18);
    spawnParticles(slots[hitSlot].visualX+SLOT_W/2, SLOT_Y+20, '#ff2222', 14);
    slots[hitSlot].shakeOff = 16;
    bigText = '💀 -20'; bigTextColor = '#ff4444'; bigTextAlpha = 1.2;
    addFeedback('陷阱!', slots[hitSlot].visualX+SLOT_W/2, SLOT_Y-40, '#ff4444');
    // Trap hit also ends rep (you wasted it)
    endRep(true);
  } else {
    combo = 0;
    score = Math.max(0, score - 8);
    shake(11);
    flashAlpha = 0.2; flashColor = '#ff4400';
    spawnParticles(slots[hitSlot].visualX+SLOT_W/2, SLOT_Y+30, '#aa6622', 7);
    slots[hitSlot].shakeOff = 11;
    bigText = '-8'; bigTextColor = '#ff8844'; bigTextAlpha = 0.9;
    addFeedback('✗', slots[hitSlot].visualX+SLOT_W/2, SLOT_Y-40, '#ff8844');
    // Wrong dig — don't end rep, cursor keeps moving (you can still skip or wait it out)
  }
  updateHUD();
}

// Util
function spawnParticles(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,decay:0.014+Math.random()*0.01,size:3+Math.random()*4,color});}}
function shake(n){shakeX=(Math.random()-0.5)*n;shakeY=(Math.random()-0.5)*n;}
function addFeedback(t,x,y,c){feedbacks.push({text:t,x,y,alpha:1.2,vy:-1.6,color:c});}
function updateHUD(){
  const moveNum = Math.floor(globalRep / 10) + 1;
  const repInMove = globalRep % 10;
  document.getElementById('h-mv').textContent=`${Math.min(moveNum,4)}/4`;
  document.getElementById('h-rp').textContent=`${repInMove}/10`;
  document.getElementById('h-sc').textContent=score;
  document.getElementById('h-cb').textContent=combo>0?`×${combo}`:'—';
}

// Update
function update(){
  shakeX*=0.8;shakeY*=0.8;
  if(flashAlpha>0)flashAlpha-=0.025;
  if(bigTextAlpha>0)bigTextAlpha-=0.018;
  for(let s of slots){
    if(s.shakeOff){s.shakeOff*=-0.7;if(Math.abs(s.shakeOff)<0.3)s.shakeOff=0;}
    if(s.glow>0)s.glow*=0.96;
  }
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
  feedbacks.forEach(f=>{f.y+=f.vy;f.alpha-=0.016;});
  feedbacks=feedbacks.filter(f=>f.alpha>0);

  if(state==='reveal'){
    revealTimer++;
    if(revealTimer>revealDuration){
      planSwaps();
      startSwapSequence();
    }
  }

  if(state==='swapping'&&currentSwap){
    currentSwap.progress++;
    const t=currentSwap.progress/currentSwap.speed;
    const ease=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const a=currentSwap.a, b=currentSwap.b;
    const aX=slotLeftX(a), bX=slotLeftX(b);
    slots[a].visualX=aX+(bX-aX)*ease;
    slots[b].visualX=bX+(aX-bX)*ease;
    slots[a].arcY=-35*(1-Math.pow(2*ease-1,2));
    slots[b].arcY=25*(1-Math.pow(2*ease-1,2));
    if(currentSwap.progress>=currentSwap.speed){
      slots[a].visualX=bX;slots[b].visualX=aX;
      slots[a].arcY=0;slots[b].arcY=0;
      const tmp=slots[a];slots[a]=slots[b];slots[b]=tmp;
      slots[a].visualX=slotLeftX(a);slots[b].visualX=slotLeftX(b);
      targetIndices=targetIndices.map(i=>i===a?b:i===b?a:i);
      if(trapIndex===a)trapIndex=b;else if(trapIndex===b)trapIndex=a;
      currentSwap=null;
      setTimeout(()=>doNextSwap(),100);
    }
  }

  if(state==='play'&&repActive){
    cursorX+=cursorSpeed*cursorDir;
    if(cursorX>W-25)cursorDir=-1;
    if(cursorX<25)cursorDir=1;
    repTimer++;
    if(repTimer>(W-50)/cursorSpeed)endRep(false);
  }
}

// Draw
function drawBG(){
  // Sky
  const g=ctx.createLinearGradient(0,0,0,H*0.45);
  g.addColorStop(0,'#1a3828');g.addColorStop(0.6,'#1e3a1e');g.addColorStop(1,'#2a3a18');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H*0.45);
  // Ground
  const gy=H*0.40;
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,'#4a3a1e');gg.addColorStop(0.3,'#3d2e1a');gg.addColorStop(1,'#2a1f0a');
  ctx.fillStyle=gg;ctx.fillRect(0,gy,W,H-gy);
  // Ground texture line
  ctx.strokeStyle='rgba(90,70,40,0.4)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,gy+2);ctx.lineTo(W,gy+2);ctx.stroke();
  // Distant hills
  ctx.fillStyle='#1a2e16';
  ctx.beginPath();ctx.moveTo(0,gy);
  ctx.quadraticCurveTo(W*0.25,gy-40,W*0.5,gy-10);
  ctx.quadraticCurveTo(W*0.75,gy-30,W,gy);ctx.lineTo(W,gy);ctx.closePath();ctx.fill();
}

function drawSlot(s,i){
  const x=s.visualX+(s.shakeOff||0), y=SLOT_Y+(s.arcY||0);
  if(s.glow>0){
    ctx.save();ctx.shadowColor='#7aff7a';ctx.shadowBlur=40*s.glow;
    ctx.fillStyle=`rgba(100,255,100,${s.glow*0.2})`;
    ctx.beginPath();ctx.roundRect(x-8,y-8,SLOT_W+16,SLOT_H+16,16);ctx.fill();ctx.restore();
  }
  if(s.dug){
    ctx.fillStyle='#1f150a';
    ctx.beginPath();ctx.ellipse(x+SLOT_W/2,y+SLOT_H-16,SLOT_W/2-6,20,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#3a2a18';ctx.lineWidth=1.5;ctx.stroke();
  } else {
    const mg=ctx.createRadialGradient(x+SLOT_W/2,y+SLOT_H-26,4,x+SLOT_W/2,y+SLOT_H-26,SLOT_W/2);
    mg.addColorStop(0,'#7a5a30');mg.addColorStop(1,'#3d2e1a');
    ctx.fillStyle=mg;
    ctx.beginPath();ctx.moveTo(x+8,y+SLOT_H-8);ctx.quadraticCurveTo(x+SLOT_W/2,y+12,x+SLOT_W-8,y+SLOT_H-8);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#5a4020';ctx.lineWidth=1;ctx.stroke();
    ctx.strokeStyle='#4a8a3a';ctx.lineWidth=1.5;
    for(let g=0;g<2;g++){const gx=x+20+g*40,gy2=y+36+g*6;ctx.beginPath();ctx.moveTo(gx,gy2);ctx.quadraticCurveTo(gx+4,gy2-12,gx+1,gy2-17);ctx.stroke();}
  }
  if(s.revealed&&s.item){ctx.font='32px serif';ctx.textAlign='center';ctx.fillText(s.item,x+SLOT_W/2,y+SLOT_H/2+8);}
}

function drawReveal(){
  if(state!=='reveal')return;
  const fadeIn=Math.min(1,revealTimer/15);
  const fadeOut=revealTimer>revealDuration-25?Math.max(0,1-(revealTimer-(revealDuration-25))/25):1;
  const a=fadeIn*fadeOut;
  ctx.save();ctx.globalAlpha=a;
  for(let i=0;i<SLOT_COUNT;i++){
    if(slots[i].isTarget){
      const sx=slots[i].visualX;
      ctx.strokeStyle='#ffd700';ctx.lineWidth=3;ctx.setLineDash([6,4]);
      ctx.beginPath();ctx.roundRect(sx-4,SLOT_Y-4,SLOT_W+8,SLOT_H+8,12);ctx.stroke();ctx.setLineDash([]);
      ctx.font='36px serif';ctx.textAlign='center';
      ctx.fillText(slots[i].item,sx+SLOT_W/2,SLOT_Y-12+Math.sin(revealTimer*0.06)*3);
    }
    if(slots[i].isTrap){
      const sx=slots[i].visualX;
      ctx.strokeStyle='rgba(255,60,60,0.5)';ctx.lineWidth=2;ctx.setLineDash([4,3]);
      ctx.beginPath();ctx.roundRect(sx-3,SLOT_Y-3,SLOT_W+6,SLOT_H+6,12);ctx.stroke();ctx.setLineDash([]);
      ctx.font='26px serif';ctx.textAlign='center';ctx.fillText(slots[i].item,sx+SLOT_W/2,SLOT_Y-8);
    }
  }
  ctx.restore();
  // Hint
  const diff=getDiff(globalRep);
  ctx.save();ctx.globalAlpha=a;
  ctx.font='16px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffd700';
  let hint='记住位置!';
  if(diff.swaps>0)hint=`记住! 会交换${diff.swaps}次`;
  ctx.fillText(hint,W/2,50);ctx.restore();
}

function drawSwapHint(){
  if(state!=='swapping')return;
  ctx.save();ctx.font='12px -apple-system, sans-serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(255,180,60,0.7)';ctx.fillText('交换中...',W/2,58);ctx.restore();
}

function drawCursor(){
  if(state!=='play'||!repActive)return;
  const y1=SLOT_Y-32,y2=SLOT_Y+SLOT_H+18;
  const bg=ctx.createLinearGradient(cursorX,y1,cursorX,y2);
  bg.addColorStop(0,'rgba(74,200,74,0)');bg.addColorStop(0.2,'rgba(74,200,74,0.3)');
  bg.addColorStop(0.8,'rgba(74,200,74,0.3)');bg.addColorStop(1,'rgba(74,200,74,0)');
  ctx.fillStyle=bg;ctx.fillRect(cursorX-3,y1,6,y2-y1);
  ctx.fillStyle='#5aee5a';
  ctx.beginPath();ctx.moveTo(cursorX,y1+14);ctx.lineTo(cursorX-9,y1);ctx.lineTo(cursorX+9,y1);ctx.closePath();ctx.fill();
  ctx.save();ctx.shadowColor='#5aee5a';ctx.shadowBlur=10;
  ctx.fillStyle='#5aee5a';ctx.beginPath();ctx.arc(cursorX,y1-4,3.5,0,Math.PI*2);ctx.fill();ctx.restore();
}

function drawProgress(){
  const bW=200,bH=4,bx=W/2-bW/2,by=H-20;
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.beginPath();ctx.roundRect(bx,by,bW,bH,2);ctx.fill();
  ctx.fillStyle='#5aee5a';ctx.beginPath();ctx.roundRect(bx,by,bW*(globalRep/TOTAL_REPS),bH,2);ctx.fill();
}

function drawFlash(){if(flashAlpha<=0)return;ctx.save();ctx.globalAlpha=flashAlpha;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.restore();}
function drawBigText(){
  if(bigTextAlpha<=0)return;
  ctx.save();ctx.globalAlpha=Math.min(1,bigTextAlpha);
  ctx.font=`bold ${34+(1.3-Math.min(1.3,bigTextAlpha))*8}px -apple-system, sans-serif`;
  ctx.textAlign='center';ctx.fillStyle=bigTextColor;ctx.shadowColor=bigTextColor;ctx.shadowBlur=25;
  ctx.fillText(bigText,W/2,H*0.28);ctx.restore();
}
function drawTargetBanner(){
  if(state!=='play'&&state!=='swapping')return;
  const r=targetIndices.filter(i=>!slots[i].dug);
  if(!r.length)return;
  // Big target at very top
  ctx.save();
  ctx.font='bold 18px -apple-system, sans-serif';ctx.textAlign='center';
  ctx.fillStyle='rgba(255,215,0,0.8)';ctx.fillText('挖到它:',W/2,55);
  ctx.font='56px serif';
  ctx.fillText(r.map(i=>slots[i].item).join('  '),W/2,110);
  ctx.restore();
}
function drawDone(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.8)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='26px -apple-system, sans-serif';ctx.fillStyle='#fff';ctx.fillText('Session 完成',W/2,H/2-45);
  ctx.font='22px -apple-system, sans-serif';ctx.fillStyle='#ffd700';ctx.fillText(`总分: ${score}`,W/2,H/2-5);
  const grade=score>=500?'S':score>=350?'A':score>=200?'B':'C';
  const gc=score>=500?'#ffd700':score>=350?'#7aff7a':score>=200?'#88aaff':'#aaa';
  ctx.font='bold 40px -apple-system, sans-serif';ctx.fillStyle=gc;ctx.fillText(grade,W/2,H/2+50);
  ctx.font='12px -apple-system, sans-serif';ctx.fillStyle='#888';
  ctx.fillText('40下完成 · 点击重玩',W/2,H/2+85);ctx.restore();
}

function render(){
  ctx.save();ctx.translate(shakeX,shakeY);
  drawBG();
  for(let i=0;i<slots.length;i++)drawSlot(slots[i],i);
  drawReveal();drawSwapHint();drawCursor();
  ctx.restore();
  drawTargetBanner();drawFlash();drawBigText();drawProgress();
  for(let p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x+shakeX,p.y+shakeY,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();}
  for(let f of feedbacks){ctx.save();ctx.globalAlpha=Math.min(1,f.alpha);ctx.font='bold 22px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);ctx.restore();}
  if(state==='sessionDone')drawDone();
}

function loop(){update();ctx.clearRect(0,0,W,H);render();requestAnimationFrame(loop);}

function handleInput(){if(state==='sessionDone'){resetGame();return;}strike();}
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();handleInput();}});
canvas.addEventListener('click',handleInput);
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleInput();});

function resetGame(){globalRep=0;score=0;combo=0;updateHUD();startNewRound();}

document.getElementById('go-btn').addEventListener('click',()=>{
  document.getElementById('start-overlay').style.display='none';
  startNewRound();loop();
});
</script>
</body>
</html>

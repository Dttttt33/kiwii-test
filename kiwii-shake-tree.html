<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwii Power — 摇果树</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a2a12;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  overflow: hidden; user-select: none;
}
canvas { border-radius: 12px; cursor: pointer; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10;
}
.hi {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 7px 16px; border-radius: 14px; font-size: 15px; color: #ccc;
}
.hi span { font-weight: 600; }
.hi .g { color: #7aff7a; }
.hi .y { color: #ffd700; }
#start-overlay {
  position: fixed; inset: 0; background: rgba(8,12,8,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 16px;
}
#start-overlay h1 { color: #fff; font-size: 36px; font-weight: 300; }
#start-overlay p { color: #aaa; font-size: 17px; max-width: 400px; text-align: center; line-height: 2.2; }
#start-overlay strong { color: #ffd700; }
#go-btn {
  margin-top: 14px; padding: 14px 40px; font-size: 16px;
  background: #8a6a2a; color: #fff; border: none; border-radius: 24px; cursor: pointer;
}
#go-btn:active { transform: scale(0.95); }
#btm { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; z-index: 10; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>🌳 摇果树</h1>
  <p>
    <strong style="color:#fff;font-size:15px">本质：风险选择 × 运气爆发</strong><br>
    <span style="color:#aaa;font-size:13px">每一下发力都是一次「选哪棵树」的博弈 — 训练快速决策</span><br><br>
    光标扫过果树<br>
    <strong>空格 / 点击 = 摇！</strong><br><br>
    果子掉下来就是分 · 连续摇出同色 = 🎰 大奖<br><br>
    <span style="color:#888;font-size:14px;line-height:1.8">
    ▸ 前期：普通果子 × 2，建立摇树节奏<br>
    ▸ 中期：烂果🫤(3 连 = -50!)、同棵树 combo<br>
    ▸ 后期：✨金色树(稀有×2)、奖励树会枯萎、4 果掉落<br><br>
    ▸ <span style="color:#aaa">扩展方向：季节轮换不同果树、种树+养成、多人同场摇树竞速</span>
    </span>
  </p>
  <button id="go-btn">开始摇</button>
</div>

<div id="hud">
  <div class="hi">动作 <span class="g" id="h-mv">1/4</span></div>
  <div class="hi">Rep <span class="g" id="h-rp">0/10</span></div>
  <div class="hi">分 <span class="y" id="h-sc">0</span></div>
</div>
<div id="btm">空格/点击 = 摇光标下的树</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(960, window.innerWidth - 20);
const H = Math.min(640, window.innerHeight - 20);
canvas.width = W; canvas.height = H;

const TREE_COUNT = 5;
const TREE_W = 120;
const TREE_GAP = (W - TREE_COUNT * TREE_W) / (TREE_COUNT + 1);
const TREE_Y = H * 0.25;
const GROUND_Y = H * 0.72;
const TOTAL_MOVES = 4, REPS_PER_MOVE = 10;
const TOTAL_REPS = TOTAL_MOVES * REPS_PER_MOVE;

const FRUITS = [
  {emoji:'🍎', value: 10, color:'#ff6655', weight: 35},
  {emoji:'🍊', value: 15, color:'#ff9933', weight: 28},
  {emoji:'🍇', value: 25, color:'#aa55dd', weight: 20},
  {emoji:'🍋', value: 40, color:'#eedd22', weight: 12},
  {emoji:'🌟', value: 150, color:'#ffd700', weight: 5},
  {emoji:'🫤', value: -15, color:'#666655', weight: 0}, // rotten — only in pool later
];

function getDiff(rep) {
  const t = rep / (TOTAL_REPS - 1);
  return {
    fruitsPerTree: Math.round(4 + t * 2),
    cursorSpeed: 1.3 + t * 0.8,
    goldenChance: 0.02 + t * 0.08,
    dropCount: Math.min(2 + Math.floor(t * 2), 4),
    goldenTreeChance: Math.max(0, (t - 0.25) * 0.35),
    rottenWeight: Math.max(0, Math.floor((t - 0.2) * 18)),
    witherSpeed: Math.max(0, (t - 0.4) * 0.015),
    bonusTreeChance: Math.max(0, (t - 0.5) * 0.2),
  };
}

function pickFruit(goldenChance, rottenWeight) {
  if (Math.random() < goldenChance) return FRUITS[4];
  const pool = FRUITS.slice(0, 4).map(f => ({...f}));
  // Add rotten fruit to pool later in game
  if (rottenWeight > 0) pool.push({...FRUITS[5], weight: rottenWeight});
  const totalW = pool.reduce((s,f) => s + f.weight, 0);
  let r = Math.random() * totalW;
  for (let f of pool) { r -= f.weight; if (r <= 0) return f; }
  return pool[0];
}

let lastShakenTree = -1, treeCombo = 0;

// State
let state = 'idle';
let globalRep = 0, score = 0, displayScore = 0;
let trees = [];
let fallingFruits = []; // {x, y, vy, vx, fruit, alpha, landed}
let cursorX = 0, cursorDir = 1, cursorSpeed = 1.5;
let repActive = false, struck = false, repTimer = 0;
let particles = [], feedbacks = [], scorePops = [];
let shakeX = 0, shakeY = 0;
let flashAlpha = 0, flashColor = '';
let bigText = '', bigTextAlpha = 0, bigTextColor = '';
let reelHistory = []; // last fruits for slot matching

function treeLeftX(i) { return TREE_GAP + i * (TREE_W + TREE_GAP); }

function initTrees() {
  const diff = getDiff(globalRep);
  trees = [];
  for (let i = 0; i < TREE_COUNT; i++) {
    const isGolden = Math.random() < diff.goldenTreeChance;
    const isBonus = !isGolden && Math.random() < diff.bonusTreeChance;
    const fruits = [];
    const fruitCount = isBonus ? diff.fruitsPerTree + 3 : diff.fruitsPerTree;
    for (let f = 0; f < fruitCount; f++) {
      const fruit = isGolden ? FRUITS[3 + Math.floor(Math.random() * 2)] : pickFruit(diff.goldenChance, diff.rottenWeight);
      fruits.push({ fruit, ox: (Math.random() - 0.5) * 55, oy: -15 - Math.random() * 55 });
    }
    trees.push({
      x: treeLeftX(i), fruits, shakeAmt: 0, shakePhase: 0, regrow: 0,
      golden: isGolden, bonus: isBonus,
      wither: 0, maxWither: isBonus ? 180 : 0,
    });
  }
}

function startNewRound() {
  initTrees();
  fallingFruits = [];
  const diff = getDiff(globalRep);
  cursorSpeed = diff.cursorSpeed;
  struck = false; repActive = false;
  state = 'play';
  startRep();
  updateHUD();
}

function startRep() { repActive = true; struck = false; repTimer = 0; }

function endRep() {
  repActive = false;
  globalRep++;
  updateHUD();
  if (globalRep >= TOTAL_REPS) { state = 'sessionDone'; return; }
  setTimeout(() => startRep(), 280);
}

function shakeTree(idx) {
  const tree = trees[idx];
  if (tree.fruits.length === 0) {
    addFeedback('空了', tree.x + TREE_W/2, TREE_Y + 50, '#777');
    return false;
  }

  // Tree combo — same tree consecutive = bonus
  if (idx === lastShakenTree) {
    treeCombo++;
    if (treeCombo >= 2) addFeedback(`连摇 ×${treeCombo}`, tree.x + TREE_W/2, TREE_Y + 30, '#ffaa33');
  } else {
    lastShakenTree = idx;
    treeCombo = 1;
  }

  tree.shakeAmt = 14;
  tree.shakePhase = 0;

  const diff = getDiff(globalRep);
  const dropCount = Math.min(tree.fruits.length, diff.dropCount);
  const dropped = [];

  for (let d = 0; d < dropCount; d++) {
    const fi = Math.floor(Math.random() * tree.fruits.length);
    const f = tree.fruits.splice(fi, 1)[0];
    dropped.push(f.fruit);

    const startX = tree.x + TREE_W/2 + f.ox;
    const startY = TREE_Y + 55 + f.oy;
    fallingFruits.push({
      x: startX, y: startY,
      vx: (Math.random() - 0.5) * 4,
      vy: 0,
      fruit: f.fruit,
      alpha: 1,
      landed: false,
      bounce: 0,
    });
  }

  // Reel / slot matching
  for (let f of dropped) {
    reelHistory.push(f.emoji);
    if (reelHistory.length > 10) reelHistory.shift();
  }
  checkSlotMatch();

  // Regrow if empty
  if (tree.fruits.length === 0) {
    tree.regrow = 120 + Math.floor(Math.random() * 60);
  }

  return true;
}

function checkSlotMatch() {
  const slotCount = getReelSlots();
  if (reelHistory.length < slotCount) return;
  const lastN = reelHistory.slice(-slotCount);

  // Check full match
  if (lastN.every(e => e === lastN[0])) {
    const fruit = FRUITS.find(f => f.emoji === lastN[0]);
    if (fruit.value < 0) {
      const penalty = -30 * slotCount;
      score = Math.max(0, score + penalty);
      flashAlpha = 0.35; flashColor = '#444';
      bigText = `💀 ${slotCount}连烂! ${penalty}`;
      bigTextColor = '#ff4444'; bigTextAlpha = 1.5;
      shake(14);
    } else {
      const baseMult = fruit.emoji === '🌟' ? 20 : (fruit.value >= 25 ? 8 : 5);
      const sizeMult = slotCount >= 5 ? 3 : slotCount >= 4 ? 2 : 1;
      const bonus = fruit.value * baseMult * sizeMult;
      score += bonus;
      flashAlpha = 0.3; flashColor = fruit.color;
      bigText = `🎰 ${slotCount}连! ${lastN.join('')}  +${bonus}`;
      bigTextColor = fruit.color; bigTextAlpha = 2.0;
      spawnParticles(W/2, 100, fruit.color, 25 + slotCount * 5);
      spawnParticles(W/2 - 60, 100, '#ffd700', 15);
      spawnParticles(W/2 + 60, 100, '#ffd700', 15);
      shake(8 + slotCount * 2);
    }
    reelHistory = [];
    return;
  }

  // Partial match: last 3 same within the reel (only when reel is 4+)
  if (slotCount >= 4 && lastN.length >= 3) {
    const tail3 = lastN.slice(-3);
    if (tail3[0] === tail3[1] && tail3[1] === tail3[2]) {
      const fruit = FRUITS.find(f => f.emoji === tail3[0]);
      if (fruit && fruit.value > 0) {
        const bonus = Math.round(fruit.value * 3);
        score += bonus;
        addFeedback(`🎰 ×3 +${bonus}`, W/2, 130, fruit.color);
        spawnParticles(W/2, 100, fruit.color, 10);
      }
    }
  }
}

function strike() {
  if (state !== 'play' || !repActive || struck) return;
  struck = true;

  let hitTree = -1;
  for (let i = 0; i < TREE_COUNT; i++) {
    const tx = trees[i].x;
    if (cursorX >= tx - 10 && cursorX <= tx + TREE_W + 10) { hitTree = i; break; }
  }
  if (hitTree === -1) { endRep(); return; }

  shakeTree(hitTree);
  shake(3);
  endRep();
}

// Utils
function spawnParticles(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*5;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,decay:0.01+Math.random()*0.008,size:3+Math.random()*5,color});}}
function shake(n){shakeX+=(Math.random()-0.5)*n;shakeY+=(Math.random()-0.5)*n*0.5;}
function addFeedback(t,x,y,c){feedbacks.push({text:t,x,y,alpha:1.3,vy:-1.2,color:c});}
function addScorePop(val,x,y,color){scorePops.push({text:`+${val}`,x,y,alpha:1.5,vy:-2.5,scale:1,color});}
function updateHUD(){
  const moveNum=Math.min(Math.floor(globalRep/REPS_PER_MOVE)+1,TOTAL_MOVES);
  const repInMove=globalRep%REPS_PER_MOVE;
  document.getElementById('h-mv').textContent=`${moveNum}/${TOTAL_MOVES}`;
  document.getElementById('h-rp').textContent=`${repInMove}/${REPS_PER_MOVE}`;
  document.getElementById('h-sc').textContent=Math.round(displayScore);
}

// Update
function update(){
  shakeX *= 0.85; shakeY *= 0.85;
  if (flashAlpha > 0) flashAlpha -= 0.012;
  if (bigTextAlpha > 0) bigTextAlpha -= 0.015;

  // Score rolls up
  if (displayScore < score) {
    const gap = score - displayScore;
    displayScore += Math.max(1, gap * 0.1);
    if (displayScore > score) displayScore = score;
    updateHUD();
  }

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
  feedbacks.forEach(f=>{f.y+=f.vy;f.alpha-=0.012;});
  feedbacks=feedbacks.filter(f=>f.alpha>0);
  scorePops.forEach(s=>{s.y+=s.vy;s.vy*=0.96;s.alpha-=0.018;s.scale+=0.01;});
  scorePops=scorePops.filter(s=>s.alpha>0);

  // Trees
  const diff = getDiff(globalRep);
  for (let t of trees) {
    if (t.shakeAmt > 0) {
      t.shakePhase += 0.5;
      t.shakeAmt *= 0.88;
      if (t.shakeAmt < 0.2) t.shakeAmt = 0;
    }
    if (t.fruits.length === 0 && t.regrow > 0) {
      t.regrow--;
      if (t.regrow <= 0) {
        for (let f = 0; f < diff.fruitsPerTree; f++) {
          t.fruits.push({
            fruit: pickFruit(diff.goldenChance),
            ox: (Math.random() - 0.5) * 55,
            oy: -15 - Math.random() * 55,
          });
        }
      }
    }
    // Bonus trees wither over time — lose a fruit periodically
    if (t.bonus && t.fruits.length > 0 && t.maxWither > 0) {
      t.wither++;
      if (t.wither > t.maxWither) {
        t.fruits.pop();
        t.wither = 0;
        if (t.fruits.length === 0) {
          addFeedback('枯了!', t.x + TREE_W/2, TREE_Y + 40, '#885533');
          t.bonus = false;
        }
      }
    }
    // Normal trees wither slowly in late game
    if (!t.bonus && !t.golden && diff.witherSpeed > 0 && t.fruits.length > 0) {
      if (Math.random() < diff.witherSpeed) {
        t.fruits.pop();
        if (t.fruits.length === 0) {
          t.regrow = 80 + Math.floor(Math.random() * 40);
        }
      }
    }
  }

  // Falling fruits
  for (let ff of fallingFruits) {
    if (ff.landed) { ff.alpha -= 0.015; continue; }
    ff.vy += 0.4;
    ff.x += ff.vx;
    ff.y += ff.vy;
    ff.vx *= 0.99;

    // Hit ground
    if (ff.y >= GROUND_Y) {
      ff.y = GROUND_Y;
      ff.landed = true;
      const comboMult = treeCombo >= 2 ? 1 + (treeCombo - 1) * 0.2 : 1;
      const pts = Math.round(ff.fruit.value * comboMult);
      if (ff.fruit.value < 0) {
        // Rotten!
        score = Math.max(0, score + ff.fruit.value);
        addScorePop(ff.fruit.value, ff.x, GROUND_Y - 20, '#666');
        shake(4);
        addFeedback('烂果!', ff.x, GROUND_Y - 40, '#666');
      } else {
        score += pts;
        addScorePop(pts, ff.x, GROUND_Y - 20, ff.fruit.color);
      }
      spawnParticles(ff.x, GROUND_Y, ff.fruit.color, 4);
      if (ff.fruit.value >= 100) {
        spawnParticles(ff.x, GROUND_Y - 10, '#ffd700', 10);
        shake(4);
        addFeedback(`🌟 ${ff.fruit.value}!`, ff.x, GROUND_Y - 50, '#ffd700');
      }
    }
  }
  fallingFruits = fallingFruits.filter(ff => ff.alpha > 0);

  // Cursor
  if (state === 'play' && repActive) {
    cursorX += cursorSpeed * cursorDir;
    if (cursorX > W - 25) cursorDir = -1;
    if (cursorX < 25) cursorDir = 1;
    repTimer++;
    if (repTimer > (W - 50) / cursorSpeed) endRep();
  }
}

// Draw
function drawBG(){
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.55);
  g.addColorStop(0, '#1e3a28'); g.addColorStop(1, '#2a4a2a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.55);
  // Ground
  const gg = ctx.createLinearGradient(0, H*0.55, 0, H);
  gg.addColorStop(0, '#3a5520'); gg.addColorStop(0.5, '#2a4018'); gg.addColorStop(1, '#1a2a0a');
  ctx.fillStyle = gg; ctx.fillRect(0, H*0.55, W, H*0.45);
  // Ground line
  ctx.strokeStyle = 'rgba(100,160,60,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y + 5); ctx.lineTo(W, GROUND_Y + 5); ctx.stroke();
}

function drawTree(t, i) {
  const cx = t.x + TREE_W/2;
  const baseY = GROUND_Y;
  const off = t.shakeAmt * Math.sin(t.shakePhase);

  ctx.save();

  // Trunk
  ctx.fillStyle = '#6a4420';
  ctx.beginPath();
  ctx.moveTo(cx - 12 + off*0.3, baseY);
  ctx.lineTo(cx - 8 + off*0.6, baseY - 90);
  ctx.lineTo(cx + 8 + off*0.6, baseY - 90);
  ctx.lineTo(cx + 12 + off*0.3, baseY);
  ctx.fill();

  // Branches
  ctx.fillStyle = '#5a3a18';
  ctx.fillRect(cx - 30 + off*0.7, baseY - 85, 8, -15);
  ctx.fillRect(cx + 22 + off*0.7, baseY - 80, 8, -12);

  // Canopy layers
  const canopyY = baseY - 130;
  if (t.golden) {
    ctx.fillStyle = '#8a7a20';
    ctx.beginPath(); ctx.ellipse(cx + off, canopyY + 20, 50, 40, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#aaa030';
    ctx.beginPath(); ctx.ellipse(cx - 15 + off, canopyY, 35, 30, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 18 + off, canopyY + 5, 30, 28, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ccbb40';
    ctx.beginPath(); ctx.ellipse(cx + off, canopyY - 10, 22, 20, 0, 0, Math.PI*2); ctx.fill();
    // Golden glow
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 15;
    ctx.beginPath(); ctx.ellipse(cx + off, canopyY + 10, 45, 35, 0, 0, Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = '#2a7a2a';
    ctx.beginPath(); ctx.ellipse(cx + off, canopyY + 20, 50, 40, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a9a3a';
    ctx.beginPath(); ctx.ellipse(cx - 15 + off, canopyY, 35, 30, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 18 + off, canopyY + 5, 30, 28, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4aaa4a';
    ctx.beginPath(); ctx.ellipse(cx + off, canopyY - 10, 22, 20, 0, 0, Math.PI*2); ctx.fill();
  }

  // Fruits on tree
  for (let f of t.fruits) {
    const fx = cx + f.ox + off * 0.8;
    const fy = canopyY + 25 + f.oy;
    ctx.font = '22px serif'; ctx.textAlign = 'center';
    ctx.fillText(f.fruit.emoji, fx, fy);
  }

  ctx.restore();

  // Count badge
  if (t.fruits.length > 0) {
    ctx.font = 'bold 13px -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(`${t.fruits.length}`, cx, baseY + 16);
  } else if (t.regrow > 0) {
    const pct = 1 - t.regrow / 180;
    ctx.fillStyle = 'rgba(100,200,100,0.3)';
    ctx.fillRect(cx - 20, baseY + 10, 40 * pct, 4);
  }
}

function drawFallingFruits() {
  for (let ff of fallingFruits) {
    ctx.save(); ctx.globalAlpha = ff.alpha;
    const size = ff.landed ? 18 : 24;
    ctx.font = `${size}px serif`; ctx.textAlign = 'center';
    ctx.fillText(ff.fruit.emoji, ff.x, ff.y);
    ctx.restore();
  }
}

function drawCursor(){
  if (state !== 'play' || !repActive) return;
  const y1 = TREE_Y - 10, y2 = GROUND_Y + 10;
  const bg = ctx.createLinearGradient(cursorX, y1, cursorX, y2);
  bg.addColorStop(0, 'rgba(255,210,60,0)');
  bg.addColorStop(0.15, 'rgba(255,210,60,0.2)');
  bg.addColorStop(0.85, 'rgba(255,210,60,0.2)');
  bg.addColorStop(1, 'rgba(255,210,60,0)');
  ctx.fillStyle = bg; ctx.fillRect(cursorX - 3, y1, 6, y2 - y1);
  // Arrow
  ctx.fillStyle = '#ffcc33';
  ctx.beginPath(); ctx.moveTo(cursorX, y1 + 10); ctx.lineTo(cursorX - 8, y1); ctx.lineTo(cursorX + 8, y1); ctx.closePath(); ctx.fill();
  // Dot
  ctx.save(); ctx.shadowColor = '#ffcc33'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffcc33'; ctx.beginPath(); ctx.arc(cursorX, y1 - 3, 3, 0, Math.PI*2); ctx.fill(); ctx.restore();

  // Highlight which tree cursor is over
  for (let i = 0; i < TREE_COUNT; i++) {
    const tx = trees[i].x;
    if (cursorX >= tx - 10 && cursorX <= tx + TREE_W + 10) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,210,60,0.25)'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.roundRect(tx - 5, TREE_Y - 10, TREE_W + 10, GROUND_Y - TREE_Y + 20, 12); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
      break;
    }
  }
}

function getReelSlots() {
  const t = globalRep / (TOTAL_REPS - 1);
  if (t < 0.3) return 3;
  if (t < 0.6) return 4;
  return 5;
}

function drawReel() {
  const slotCount = getReelSlots();
  const slotSize = 44;
  const gap = 8;
  const totalW = slotCount * slotSize + (slotCount - 1) * gap + 40;
  const rx = W / 2 - totalW / 2;
  const ry = 55;
  const totalH = 62;

  // Background
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.beginPath(); ctx.roundRect(rx, ry, totalW, totalH, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,200,0,0.4)'; ctx.lineWidth = 2; ctx.stroke();

  // Title
  ctx.font = 'bold 12px -apple-system, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,200,0,0.8)';
  const label = slotCount >= 5 ? '🎰 五连!' : slotCount >= 4 ? '🎰 四连' : '🎰 三连';
  ctx.fillText(label, W / 2, ry + 14);

  // Slots
  const startX = rx + 20;
  const display = reelHistory.slice(-slotCount);
  for (let i = 0; i < slotCount; i++) {
    const sx = startX + i * (slotSize + gap);
    const sy = ry + 20;
    // Slot bg
    ctx.fillStyle = 'rgba(40,30,10,0.8)';
    ctx.beginPath(); ctx.roundRect(sx, sy, slotSize, slotSize - 6, 8); ctx.fill();
    ctx.strokeStyle = 'rgba(255,200,0,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    // Emoji
    const emoji = display[i] || '';
    if (emoji) {
      ctx.font = '28px serif'; ctx.textAlign = 'center';
      ctx.fillText(emoji, sx + slotSize / 2, sy + slotSize / 2 + 4);
    } else {
      ctx.font = '20px serif'; ctx.textAlign = 'center';
      ctx.globalAlpha = 0.2;
      ctx.fillText('?', sx + slotSize / 2, sy + slotSize / 2 + 4);
      ctx.globalAlpha = 1;
    }
  }

  // Match highlight
  if (display.length >= slotCount && display.every(e => e === display[0])) {
    ctx.save();
    ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.roundRect(rx + 2, ry + 2, totalW - 4, totalH - 4, 13); ctx.stroke();
    ctx.restore();
  }
}

function drawScorePops() {
  for (let s of scorePops) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, s.alpha);
    ctx.font = `bold ${16 * s.scale}px -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = s.color;
    ctx.shadowColor = s.color; ctx.shadowBlur = 6;
    ctx.fillText(s.text, s.x, s.y);
    ctx.restore();
  }
}

function drawProgress(){
  const bW=200,bH=4,bx=W/2-bW/2,by=H-18;
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.beginPath();ctx.roundRect(bx,by,bW,bH,2);ctx.fill();
  ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.roundRect(bx,by,bW*(globalRep/TOTAL_REPS),bH,2);ctx.fill();
}

function drawFlash(){if(flashAlpha<=0)return;ctx.save();ctx.globalAlpha=flashAlpha;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.restore();}
function drawBigText(){
  if(bigTextAlpha<=0)return;
  ctx.save();ctx.globalAlpha=Math.min(1,bigTextAlpha);
  const size = 26 + (1.8 - Math.min(1.8, bigTextAlpha)) * 5;
  ctx.font=`bold ${size}px -apple-system, sans-serif`;
  ctx.textAlign='center';ctx.fillStyle=bigTextColor;ctx.shadowColor=bigTextColor;ctx.shadowBlur=18;
  ctx.fillText(bigText, W/2, H*0.48);ctx.restore();
}

function drawDone(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='28px -apple-system, sans-serif';ctx.fillStyle='#fff';ctx.fillText('Session 完成',W/2,H/2-55);
  ctx.font='bold 32px -apple-system, sans-serif';ctx.fillStyle='#ffd700';ctx.fillText(`${Math.round(score)} 分`,W/2,H/2-5);
  const grade=score>=1200?'S':score>=700?'A':score>=400?'B':'C';
  const gc=score>=1200?'#ffd700':score>=700?'#7aff7a':score>=400?'#88aaff':'#aaa';
  ctx.font='bold 48px -apple-system, sans-serif';ctx.fillStyle=gc;ctx.fillText(grade,W/2,H/2+60);
  ctx.font='14px -apple-system, sans-serif';ctx.fillStyle='#888';ctx.fillText('点击重玩',W/2,H/2+95);ctx.restore();
}

function render(){
  ctx.save(); ctx.translate(shakeX, shakeY);
  drawBG();
  drawFallingFruits();
  for (let i = 0; i < trees.length; i++) drawTree(trees[i], i);
  drawCursor();
  ctx.restore();
  drawReel();
  drawScorePops();
  drawFlash(); drawBigText(); drawProgress();
  for(let p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x+shakeX,p.y+shakeY,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();}
  for(let f of feedbacks){ctx.save();ctx.globalAlpha=Math.min(1,f.alpha);ctx.font='bold 16px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);ctx.restore();}
  if(state==='sessionDone') drawDone();
}

function loop(){ update(); ctx.clearRect(0,0,W,H); render(); requestAnimationFrame(loop); }

function handleInput(){ if(state==='sessionDone'){resetGame();return;} strike(); }
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();handleInput();}});
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart',e=>{e.preventDefault();handleInput();});

function resetGame(){globalRep=0;score=0;displayScore=0;reelHistory=[];reelDisplay=['','',''];cursorX=30;cursorDir=1;updateHUD();startNewRound();}

document.getElementById('go-btn').addEventListener('click',()=>{
  document.getElementById('start-overlay').style.display='none';
  startNewRound(); loop();
});
</script>
</body>
</html>

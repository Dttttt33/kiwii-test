<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwii Power — 农事节拍</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1a0f;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  overflow: hidden; user-select: none;
}
canvas { border-radius: 12px; cursor: pointer; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10;
}
.hi {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 7px 16px; border-radius: 14px; font-size: 15px; color: #ccc;
}
.hi span { font-weight: 600; }
.hi .g { color: #7aff7a; }
.hi .y { color: #ffd700; }
#start-overlay {
  position: fixed; inset: 0; background: rgba(8,12,8,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 16px;
}
#start-overlay h1 { color: #fff; font-size: 36px; font-weight: 300; }
#start-overlay p { color: #aaa; font-size: 17px; max-width: 440px; text-align: center; line-height: 2.2; }
#start-overlay strong { color: #7aff7a; }
.phase-label { font-weight: 600; }
.p-con { color: #55dd55; }
.p-hold { color: #ffd700; }
.p-ecc { color: #ff8844; }
#go-btn {
  margin-top: 14px; padding: 14px 40px; font-size: 16px;
  background: #3a8a3a; color: #fff; border: none; border-radius: 24px; cursor: pointer;
}
#go-btn:active { transform: scale(0.95); }
#btm { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; z-index: 10; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>🌾 农事节拍</h1>
  <p>
    色条持续从右边滚来<br><br>
    <span class="phase-label p-con">🌱 绿 = 向心</span> — 按住<br>
    <span class="phase-label p-hold">💧 黄 = Hold</span> — 继续按住<br>
    <span class="phase-label p-ecc">🌾 橙 = 离心</span> — 继续按住<br>
    <span style="color:#666">空隙 = 松开休息</span><br><br>
    <strong>有色条时按住 · 空隙时松开</strong><br>
    按准了果子掉，田就丰收<br><br>
    <span style="color:#888;font-size:14px;line-height:1.8">
    ▸ 前期：慢滚动、宽条子、简单节奏<br>
    ▸ 中期：加速、条子变窄、连击 combo 加倍率<br>
    ▸ 后期：金色条(×3 分)、双段连击、10 种极端节奏
    </span>
  </p>
  <button id="go-btn">开始</button>
</div>

<div id="hud">
  <div class="hi">动作 <span class="g" id="h-mv">1/4</span></div>
  <div class="hi">Rep <span class="g" id="h-rp">0/10</span></div>
  <div class="hi">分 <span class="y" id="h-sc">0</span></div>
  <div class="hi">连击 <span class="y" id="h-cb">—</span></div>
</div>
<div id="btm">有色条 = 按住 · 空隙 = 松开</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(960, window.innerWidth - 20);
const H = Math.min(640, window.innerHeight - 20);
canvas.width = W; canvas.height = H;

const TOTAL_MOVES = 4, REPS_PER_MOVE = 10;
const TOTAL_REPS = TOTAL_MOVES * REPS_PER_MOVE;

const PHASES = [
  {name: '向心', emoji: '🌱', color: '#55dd55', dark: '#2a6a2a', fruit: '🥬'},
  {name: 'Hold', emoji: '💧', color: '#ffd700', dark: '#7a6a10', fruit: '🌽'},
  {name: '离心', emoji: '🌾', color: '#ff8844', dark: '#7a3a18', fruit: '🍎'},
];

// Lane config
const LANE_Y = H * 0.25;
const LANE_H = 80;
const JUDGE_X = 100;

// Each rep has a VERY different rhythm — extreme contrast between patterns
const REP_PATTERNS = [
  {con: 40, hold: 20, ecc: 200, name: '极慢离心'},    // snap up, looong way down
  {con: 160, hold: 80, ecc: 40, name: '慢上快下'},    // slow grind up, quick release
  {con: 50, hold: 140, ecc: 50, name: '超长Hold'},   // short burst, hold forever
  {con: 35, hold: 15, ecc: 35, name: '快！'},         // super fast rep
  {con: 120, hold: 20, ecc: 180, name: '双慢'},       // slow up slow down
  {con: 30, hold: 100, ecc: 30, name: '等等等'},      // barely move, hold ages
  {con: 70, hold: 30, ecc: 70, name: '均匀'},         // balanced
  {con: 200, hold: 40, ecc: 60, name: '极慢向心'},    // crawl up, quick drop
  {con: 45, hold: 15, ecc: 220, name: '3秒离心'},     // explosive + ultra slow ecc
  {con: 30, hold: 200, ecc: 30, name: '死Hold'},     // hold until it burns
];

function getDiff(rep) {
  const t = rep / (TOTAL_REPS - 1);
  const pattern = REP_PATTERNS[rep % REP_PATTERNS.length];
  const speedMult = 1 - t * 0.2;
  return {
    speed: 1.5 + t * 1.0,
    conWidth: pattern.con * speedMult,
    holdWidth: pattern.hold * speedMult,
    eccWidth: pattern.ecc * speedMult,
    gapWidth: 55 - t * 10,
    patternName: pattern.name,
    goldenChance: Math.max(0, (t - 0.35) * 0.25), // golden bars after 35%
    doubleChance: Math.max(0, (t - 0.5) * 0.4),   // double segments after 50%
  };
}

// State
let state = 'idle';
let globalRep = 0, score = 0, combo = 0, displayScore = 0;
let holding = false;

// Continuous stream of segments
let segments = []; // {x, width, phase, rep, judged, coverage, result}
let nextSpawnX = W + 50;

// Field
let fieldGrowth = 0;
let fieldPlants = [];
let fallingFruits = []; // {x, y, vy, emoji, alpha}

// Feedback
let particles = [], feedbacks = [];
let shakeX = 0, shakeY = 0;
let flashAlpha = 0, flashColor = '';
let bigText = '', bigTextAlpha = 0, bigTextColor = '';
let holdGlow = 0; // continuous glow when holding correctly
let tickScore = 0, tickTimer = 0; // accumulated tick score for display

function initField() {
  fieldPlants = [];
  for (let i = 0; i < 12; i++) {
    fieldPlants.push({
      x: 50 + i * ((W - 100) / 11),
      y: H * 0.72 + (Math.random() - 0.5) * 20,
      growth: 0,
    });
  }
}

function spawnRep(repIdx) {
  const diff = getDiff(repIdx);
  let x = nextSpawnX;
  const isGolden = Math.random() < diff.goldenChance;
  const isDouble = Math.random() < diff.doubleChance;
  const repsToSpawn = isDouble ? 2 : 1;

  for (let r = 0; r < repsToSpawn; r++) {
    for (let p = 0; p < 3; p++) {
      const widths = [diff.conWidth, diff.holdWidth, diff.eccWidth];
      segments.push({
        x,
        width: widths[p] * (isDouble && r === 1 ? 0.7 : 1),
        phase: p,
        rep: repIdx,
        judged: false,
        coverage: 0,
        result: null,
        active: false,
        scoreGiven: 0,
        golden: isGolden,
      });
      x += widths[p] * (isDouble && r === 1 ? 0.7 : 1) + 3;
    }
    if (r === 0 && isDouble) x += 15; // small gap between double reps
  }
  nextSpawnX = x + diff.gapWidth;
}

function init() {
  segments = [];
  nextSpawnX = W + 80;
  // Pre-spawn first few reps
  for (let i = 0; i < Math.min(TOTAL_REPS, 5); i++) {
    spawnRep(i);
  }
}

// Utils
function spawnParticles(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:1,decay:0.015+Math.random()*0.01,size:2+Math.random()*4,color});}}
function shake(n){shakeX+=(Math.random()-0.5)*n;shakeY+=(Math.random()-0.5)*n*0.3;}
function addFeedback(t,x,y,c){feedbacks.push({text:t,x,y,alpha:1.3,vy:-1.5,color:c});}
function dropFruit(emoji, x) {
  fallingFruits.push({
    x: x || JUDGE_X + Math.random() * 60,
    y: LANE_Y + LANE_H + 10,
    vy: 1 + Math.random() * 2,
    vx: (Math.random() - 0.5) * 2,
    emoji,
    alpha: 1,
    size: 18 + Math.random() * 8,
  });
}
function updateHUD(){
  const moveNum=Math.min(Math.floor(globalRep/REPS_PER_MOVE)+1,TOTAL_MOVES);
  const repInMove=globalRep%REPS_PER_MOVE;
  document.getElementById('h-mv').textContent=`${moveNum}/${TOTAL_MOVES}`;
  document.getElementById('h-rp').textContent=`${repInMove}/${REPS_PER_MOVE}`;
  document.getElementById('h-sc').textContent=Math.round(displayScore);
  document.getElementById('h-cb').textContent=combo>0?`×${combo}`:'—';
}

// Update
function update(){
  shakeX *= 0.85; shakeY *= 0.85;
  if (flashAlpha > 0) flashAlpha -= 0.01;
  if (bigTextAlpha > 0) bigTextAlpha -= 0.012;
  if (holdGlow > 0 && !holding) holdGlow *= 0.9;

  // Score ticker
  if (displayScore < score) {
    displayScore += Math.max(0.5, (score - displayScore) * 0.12);
    if (displayScore > score) displayScore = score;
    updateHUD();
  }

  // Tick score display
  if (tickTimer > 0) { tickTimer--; if (tickTimer === 0) tickScore = 0; }

  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=p.decay;});
  particles=particles.filter(p=>p.life>0);
  feedbacks.forEach(f=>{f.y+=f.vy;f.alpha-=0.013;});
  feedbacks=feedbacks.filter(f=>f.alpha>0);

  // Falling fruits
  for (let f of fallingFruits) {
    f.y += f.vy; f.vy += 0.2; f.x += f.vx;
    f.alpha -= 0.012;
    // Land on field
    if (f.y > H * 0.68 && f.vy > 0) {
      f.vy = -f.vy * 0.3;
      if (Math.abs(f.vy) < 0.5) f.alpha -= 0.05;
    }
  }
  fallingFruits = fallingFruits.filter(f => f.alpha > 0);

  if (state !== 'play') return;

  const speed = getDiff(globalRep).speed;

  // Move all segments left
  for (let seg of segments) {
    seg.x -= speed;
  }
  nextSpawnX -= speed;

  // Spawn more reps as needed
  const lastRep = segments.length > 0 ? segments[segments.length-1].rep : -1;
  if (nextSpawnX < W + 200 && lastRep < TOTAL_REPS - 1) {
    spawnRep(lastRep + 1);
  }

  // Check segments in judge zone — real-time scoring
  let anyInZone = false;
  for (let seg of segments) {
    const segRight = seg.x + seg.width;
    const inZone = seg.x <= JUDGE_X && segRight > JUDGE_X;

    if (inZone) {
      anyInZone = true;
      seg.active = true;

      if (holding) {
        // Player is holding while segment is in zone — GOOD
        seg.coverage += speed / seg.width;
        seg.coverage = Math.min(1, seg.coverage);
        holdGlow = Math.min(1, holdGlow + 0.08);

        // Real-time tick rewards — juicy
        const goldenMult = seg.golden ? 3 : 1;
        const tickPts = (1.2 + (combo > 3 ? combo * 0.2 : 0)) * goldenMult;
        score += tickPts;
        tickScore += tickPts;
        tickTimer = 40;

        // Frequent visual feedback while holding
        if (Math.random() < 0.08) {
          dropFruit(PHASES[seg.phase].fruit, JUDGE_X + Math.random() * 60);
        }
        if (Math.random() < 0.12) {
          spawnParticles(JUDGE_X + 10, LANE_Y + LANE_H/2, PHASES[seg.phase].color, 2);
        }
      } else {
        // Not holding during segment — lose glow fast
        holdGlow *= 0.7;
      }
    }

    // Segment just left the zone — final judgment
    if (seg.active && segRight <= JUDGE_X && !seg.judged) {
      seg.judged = true;
      seg.active = false;
      judgeSegment(seg);
    }
  }

  // If in a gap (no segment in zone) and player is holding — small penalty
  if (!anyInZone && holding) {
    // holding during rest — minor issue, flash red subtly
    if (Math.random() < 0.02) {
      addFeedback('松开~', JUDGE_X + 30, LANE_Y - 10, 'rgba(255,100,80,0.6)');
    }
  }

  // Track rep completion
  const completedReps = new Set(segments.filter(s => s.judged).map(s => s.rep));
  if (completedReps.size > globalRep) {
    globalRep = completedReps.size;
    updateHUD();
  }

  // Clean up off-screen segments
  segments = segments.filter(s => s.x + s.width > -50);

  // End game
  if (globalRep >= TOTAL_REPS && segments.every(s => s.judged || s.x + s.width < JUDGE_X)) {
    state = 'sessionDone';
  }
}

function judgeSegment(seg) {
  const cov = seg.coverage;
  let pts, label, color;

  if (cov >= 0.85) {
    pts = 25; label = 'Perfect!'; color = '#ffd700';
    combo++;
    spawnParticles(JUDGE_X, LANE_Y + LANE_H/2, '#ffd700', 8);
    dropFruit('🌟', JUDGE_X + 30);
    const p = fieldPlants[Math.floor(Math.random()*fieldPlants.length)];
    p.growth = Math.min(1, p.growth + 0.06);
    fieldGrowth = Math.min(1, fieldGrowth + 0.012);
    shake(2);
  } else if (cov >= 0.6) {
    pts = 15; label = 'Great'; color = '#7aff7a';
    combo++;
    dropFruit(PHASES[seg.phase].fruit, JUDGE_X + 20);
    const p = fieldPlants[Math.floor(Math.random()*fieldPlants.length)];
    p.growth = Math.min(1, p.growth + 0.03);
    fieldGrowth = Math.min(1, fieldGrowth + 0.007);
  } else if (cov >= 0.3) {
    pts = 5; label = 'Good'; color = '#88aa66';
    combo = Math.max(0, combo - 1);
  } else {
    pts = 0; label = 'Miss'; color = '#cc5544';
    combo = 0;
    shake(3);
  }

  if (combo > 5) pts += combo;
  score += pts;
  seg.result = label;

  addFeedback(`${label}`, JUDGE_X + 60, LANE_Y + 15 + seg.phase * 18, color);

  // Rep complete — one full action = one crop result in the field
  const repSegs = segments.filter(s => s.rep === seg.rep && s.judged);
  if (repSegs.length === 3) {
    const perfects = repSegs.filter(s => s.result === 'Perfect!').length;
    const greats = repSegs.filter(s => s.result === 'Great').length;
    const goods = repSegs.filter(s => s.result === 'Good').length;
    const quality = perfects * 3 + greats * 2 + goods;

    // This rep's plant
    const targetPlant = fieldPlants[globalRep % fieldPlants.length];
    targetPlant.flash = 1; // trigger flash animation

    if (quality >= 8) {
      // PERFECT REP — massive reward
      const bonus = 60 + combo * 5;
      score += bonus;
      targetPlant.growth = 1;
      targetPlant.harvest = true;
      fieldGrowth = Math.min(1, fieldGrowth + 0.04);
      // Explosion of particles
      spawnParticles(targetPlant.x, targetPlant.y - 15, '#ffd700', 25);
      spawnParticles(targetPlant.x - 20, targetPlant.y, '#ff88aa', 12);
      spawnParticles(targetPlant.x + 20, targetPlant.y, '#88ffaa', 12);
      // Rain of fruits
      dropFruit('🌻', targetPlant.x - 25);
      dropFruit('🌟', targetPlant.x);
      dropFruit('🍎', targetPlant.x + 25);
      dropFruit('✨', targetPlant.x - 10);
      dropFruit('✨', targetPlant.x + 10);
      bigText = `🌻 PERFECT! +${bonus}`; bigTextColor = '#ffd700'; bigTextAlpha = 1.5;
      shake(8);
      flashAlpha = 0.18; flashColor = '#ffd700';
    } else if (quality >= 5) {
      // GREAT REP
      const bonus = 30 + combo * 2;
      score += bonus;
      targetPlant.growth = Math.min(1, targetPlant.growth + 0.4);
      fieldGrowth = Math.min(1, fieldGrowth + 0.022);
      spawnParticles(targetPlant.x, targetPlant.y - 10, '#7aff7a', 14);
      dropFruit('🌾', targetPlant.x - 10);
      dropFruit('🌾', targetPlant.x + 10);
      dropFruit('🍊', targetPlant.x);
      bigText = `🌾 Great! +${bonus}`; bigTextColor = '#7aff7a'; bigTextAlpha = 1.1;
      shake(4);
      flashAlpha = 0.08; flashColor = '#7aff7a';
    } else if (quality >= 2) {
      score += 12;
      targetPlant.growth = Math.min(1, targetPlant.growth + 0.2);
      fieldGrowth = Math.min(1, fieldGrowth + 0.01);
      spawnParticles(targetPlant.x, targetPlant.y, '#88aa66', 5);
      dropFruit('🌱', targetPlant.x);
      addFeedback('OK +12', targetPlant.x, targetPlant.y - 35, '#88aa66');
    } else {
      // BAD — visible weed + screen shake
      targetPlant.weed = true;
      shake(6);
      flashAlpha = 0.06; flashColor = '#ff3333';
      spawnParticles(targetPlant.x, targetPlant.y, '#664433', 6);
      addFeedback('💀 Miss', targetPlant.x, targetPlant.y - 35, '#cc4433');
    }
  }

  updateHUD();
}

function onPress() {
  if (state === 'sessionDone') { resetGame(); return; }
  if (state !== 'play') return;
  holding = true;
}
function onRelease() {
  holding = false;
}

// Draw
function drawBG(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#101a10'); g.addColorStop(0.4, '#1a2a18'); g.addColorStop(1, '#0a140a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function drawLane() {
  const ly = LANE_Y, lh = LANE_H;

  // Lane bg
  ctx.fillStyle = 'rgba(15,10,5,0.6)';
  ctx.beginPath(); ctx.roundRect(20, ly - 5, W - 40, lh + 10, 12); ctx.fill();

  // Judge line
  ctx.save();
  const glowAmt = holding ? 0.8 : 0.2;
  ctx.shadowColor = holding ? '#7aff7a' : '#fff'; ctx.shadowBlur = 12 * glowAmt;
  ctx.strokeStyle = holding ? `rgba(120,255,120,${0.6+holdGlow*0.4})` : 'rgba(255,255,255,0.3)';
  ctx.lineWidth = holding ? 4 : 2;
  ctx.beginPath(); ctx.moveTo(JUDGE_X, ly - 8); ctx.lineTo(JUDGE_X, ly + lh + 8); ctx.stroke();
  ctx.restore();

  // Active hold glow at judge line
  if (holdGlow > 0.1) {
    ctx.fillStyle = `rgba(120,255,120,${holdGlow * 0.1})`;
    ctx.fillRect(JUDGE_X - 15, ly, 30, lh);
  }
}

function drawSegments() {
  const ly = LANE_Y, lh = LANE_H;

  for (let seg of segments) {
    if (seg.x > W + 10 || seg.x + seg.width < 0) continue;

    const phase = PHASES[seg.phase];
    const sx = Math.max(25, seg.x);
    const sw = Math.min(seg.x + seg.width, W - 25) - sx;
    if (sw <= 0) continue;

    // Each phase looks different:
    // 向心 = rising diagonal stripes (energy going up)
    // Hold = solid flat bar (stable)
    // 离心 = descending gradient (energy releasing)
    const barY = ly + 10, barH2 = lh - 20;

    if (seg.phase === 0) {
      // 向心: rounded left, pointed right, diagonal hatching
      ctx.fillStyle = seg.judged ? 'rgba(30,50,20,0.25)' : phase.dark + 'cc';
      ctx.beginPath();
      ctx.moveTo(sx, barY + barH2); ctx.lineTo(sx, barY + 8);
      ctx.quadraticCurveTo(sx, barY, sx + 8, barY);
      ctx.lineTo(sx + sw - 6, barY); ctx.lineTo(sx + sw, barY + barH2/2);
      ctx.lineTo(sx + sw - 6, barY + barH2); ctx.lineTo(sx + 8, barY + barH2);
      ctx.quadraticCurveTo(sx, barY + barH2, sx, barY + barH2 - 8);
      ctx.closePath(); ctx.fill();
      // Diagonal stripes
      if (!seg.judged) {
        ctx.save(); ctx.clip();
        ctx.strokeStyle = phase.color + '33'; ctx.lineWidth = 2;
        for (let dx = -barH2; dx < sw + barH2; dx += 12) {
          ctx.beginPath(); ctx.moveTo(sx + dx, barY + barH2); ctx.lineTo(sx + dx + barH2, barY); ctx.stroke();
        }
        ctx.restore();
      }
    } else if (seg.phase === 1) {
      // Hold: flat rectangle, thinner, with a pulsing center line
      const holdY = barY + 12, holdH = barH2 - 24;
      ctx.fillStyle = seg.judged ? 'rgba(50,40,10,0.25)' : phase.dark + 'cc';
      ctx.beginPath(); ctx.roundRect(sx, holdY, sw, holdH, 4); ctx.fill();
      // Center pulse line
      if (!seg.judged) {
        ctx.strokeStyle = phase.color + '55'; ctx.lineWidth = 2; ctx.setLineDash([8, 4]);
        ctx.beginPath(); ctx.moveTo(sx + 4, holdY + holdH/2); ctx.lineTo(sx + sw - 4, holdY + holdH/2); ctx.stroke();
        ctx.setLineDash([]);
      }
    } else {
      // 离心: pointed left, rounded right, gradient fade
      ctx.fillStyle = seg.judged ? 'rgba(40,20,10,0.25)' : phase.dark + 'cc';
      ctx.beginPath();
      ctx.moveTo(sx, barY + barH2/2); ctx.lineTo(sx + 6, barY);
      ctx.lineTo(sx + sw - 8, barY); ctx.quadraticCurveTo(sx + sw, barY, sx + sw, barY + 8);
      ctx.lineTo(sx + sw, barY + barH2 - 8); ctx.quadraticCurveTo(sx + sw, barY + barH2, sx + sw - 8, barY + barH2);
      ctx.lineTo(sx + 6, barY + barH2);
      ctx.closePath(); ctx.fill();
      // Gradient overlay (fades out to right)
      if (!seg.judged) {
        const grad = ctx.createLinearGradient(sx, 0, sx + sw, 0);
        grad.addColorStop(0, phase.color + '44');
        grad.addColorStop(1, phase.color + '00');
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }

    // Filled coverage overlay (universal)
    if (seg.coverage > 0) {
      const fillW = sw * Math.min(1, seg.coverage);
      ctx.save();
      ctx.globalAlpha = seg.judged ? 0.3 : 0.7;
      ctx.fillStyle = phase.color;
      ctx.beginPath(); ctx.rect(sx, barY, fillW, barH2); ctx.clip();
      ctx.beginPath(); ctx.roundRect(sx, barY, sw, barH2, 6); ctx.fill();
      ctx.restore();
    }

    // Golden glow
    if (seg.golden && !seg.judged) {
      ctx.save(); ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10;
      ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(sx, barY, sw, barH2, 6); ctx.stroke();
      ctx.restore();
      // ×3 label
      ctx.font = 'bold 10px -apple-system, sans-serif'; ctx.fillStyle = '#ffd700'; ctx.textAlign = 'center';
      ctx.fillText('×3', sx + sw/2, barY - 4);
    }

    // Border highlight
    if (!seg.judged && seg.active) {
      ctx.strokeStyle = phase.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(sx, barY, sw, barH2, 6); ctx.stroke();
    }

    // Phase emoji centered
    if (sw > 45 && !seg.judged) {
      const cx = sx + sw / 2;
      const ey = seg.phase === 1 ? ly + lh/2 + 2 : ly + lh/2 + 4;
      ctx.font = seg.phase === 1 ? '16px serif' : '22px serif'; ctx.textAlign = 'center';
      ctx.fillText(phase.emoji, cx, ey);
    }

    // Result text
    if (seg.judged && seg.result && sw > 30) {
      const cx = sx + sw / 2;
      ctx.font = 'bold 11px -apple-system, sans-serif'; ctx.textAlign = 'center';
      const rc = seg.result === 'Perfect!' ? '#ffd700' : seg.result === 'Great' ? '#7aff7a' : seg.result === 'Good' ? '#88aa66' : '#cc5544';
      ctx.fillStyle = rc;
      ctx.fillText(seg.result === 'Perfect!' ? '★' : seg.result === 'Great' ? '●' : seg.result === 'Good' ? '○' : '✗', cx, ly + 5);
    }
  }
}

function drawField() {
  const baseY = H * 0.72;
  // Ground
  ctx.fillStyle = 'rgba(30,50,18,0.35)';
  ctx.beginPath(); ctx.roundRect(35, baseY - 18, W - 70, 65, 10); ctx.fill();

  const plantEmojis = ['🌱','🌿','🌾','🌻'];
  for (let p of fieldPlants) {
    // Plot
    ctx.fillStyle = 'rgba(40,30,15,0.3)';
    ctx.beginPath(); ctx.roundRect(p.x - 20, baseY - 10, 40, 46, 6); ctx.fill();

    // Flash on result
    if (p.flash && p.flash > 0) {
      ctx.save();
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 22 * p.flash;
      ctx.fillStyle = `rgba(255,215,0,${p.flash * 0.2})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      p.flash *= 0.92;
      if (p.flash < 0.03) p.flash = 0;
    }

    // Weed
    if (p.weed) {
      ctx.font = '11px serif'; ctx.textAlign = 'center';
      ctx.fillText('🌫️', p.x + 10, p.y + 10);
    }

    // Plant
    const stage = Math.min(3, Math.floor(p.growth * 4));
    const size = 16 + p.growth * 22;
    ctx.font = `${size}px serif`; ctx.textAlign = 'center';
    ctx.fillText(plantEmojis[stage], p.x, p.y);

    // Harvest sparkle
    if (p.harvest) {
      ctx.save(); ctx.globalAlpha = 0.5 + Math.sin(performance.now()*0.005)*0.3;
      ctx.font = '9px serif'; ctx.fillText('✨', p.x + 12, p.y - 10);
      ctx.restore();
    }
  }

  // Falling fruits
  for (let f of fallingFruits) {
    ctx.save(); ctx.globalAlpha = f.alpha;
    ctx.font = `${f.size}px serif`; ctx.textAlign = 'center';
    ctx.fillText(f.emoji, f.x, f.y);
    ctx.restore();
  }

  // Growth bar
  const barW = 160, barH = 7, bx = W/2 - barW/2, by = baseY + 55;
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.beginPath(); ctx.roundRect(bx, by, barW, barH, 3); ctx.fill();
  ctx.fillStyle = '#7aff7a';
  ctx.beginPath(); ctx.roundRect(bx, by, barW * fieldGrowth, barH, 3); ctx.fill();
  ctx.font = '12px -apple-system, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fillText(`🌾 丰收 ${Math.round(fieldGrowth*100)}%`, W/2, by + 20);
}

function drawHoldState() {
  const iy = LANE_Y + LANE_H + 25;
  // Hold state
  if (holding && holdGlow > 0.3) {
    ctx.font = 'bold 15px -apple-system, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = `rgba(120,255,120,${holdGlow})`;
    ctx.fillText('● 按住中', 30, iy);
    if (tickScore > 0) {
      ctx.font = 'bold 13px -apple-system, sans-serif';
      ctx.fillStyle = '#ffd700';
      ctx.fillText(`+${Math.round(tickScore)}`, 120, iy);
    }
  } else if (!holding) {
    ctx.font = '13px -apple-system, sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillText('○ 松开', 30, iy);
  }
  // Current pattern name
  const diff = getDiff(globalRep);
  ctx.font = '12px -apple-system, sans-serif'; ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillText(`节奏: ${diff.patternName}`, W - 30, iy);
}

function drawProgress(){
  const bW=200,bH=4,bx=W/2-bW/2,by=H-18;
  ctx.fillStyle='rgba(255,255,255,0.06)';ctx.beginPath();ctx.roundRect(bx,by,bW,bH,2);ctx.fill();
  ctx.fillStyle='#7aff7a';ctx.beginPath();ctx.roundRect(bx,by,bW*(globalRep/TOTAL_REPS),bH,2);ctx.fill();
}

function drawFlash(){if(flashAlpha<=0)return;ctx.save();ctx.globalAlpha=flashAlpha;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.restore();}
function drawBigText(){
  if(bigTextAlpha<=0)return;
  ctx.save();ctx.globalAlpha=Math.min(1,bigTextAlpha);
  ctx.font='bold 24px -apple-system, sans-serif';
  ctx.textAlign='center';ctx.fillStyle=bigTextColor;ctx.shadowColor=bigTextColor;ctx.shadowBlur=12;
  ctx.fillText(bigText,W/2,H*0.55);ctx.restore();
}

function drawDone(){
  ctx.save();ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.font='28px -apple-system, sans-serif';ctx.fillStyle='#fff';ctx.fillText('Session 完成',W/2,H/2-60);
  ctx.font='bold 30px -apple-system, sans-serif';ctx.fillStyle='#ffd700';ctx.fillText(`${Math.round(score)} 分`,W/2,H/2-15);
  ctx.font='16px -apple-system, sans-serif';ctx.fillStyle='#aaa';
  ctx.fillText(`丰收度 ${Math.round(fieldGrowth*100)}%`,W/2,H/2+15);
  const grade=score>=1000?'S':score>=650?'A':score>=400?'B':'C';
  const gc=score>=1000?'#ffd700':score>=650?'#7aff7a':score>=400?'#88aaff':'#aaa';
  ctx.font='bold 48px -apple-system, sans-serif';ctx.fillStyle=gc;ctx.fillText(grade,W/2,H/2+75);
  ctx.font='14px -apple-system, sans-serif';ctx.fillStyle='#888';ctx.fillText('点击重玩',W/2,H/2+105);ctx.restore();
}

function render(){
  ctx.save(); ctx.translate(shakeX, shakeY);
  drawBG();
  drawField();
  drawLane();
  drawSegments();
  ctx.restore();
  drawHoldState();
  drawFlash(); drawBigText(); drawProgress();
  for(let p of particles){ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x+shakeX,p.y+shakeY,p.size*p.life,0,Math.PI*2);ctx.fill();ctx.restore();}
  for(let f of feedbacks){ctx.save();ctx.globalAlpha=Math.min(1,f.alpha);ctx.font='bold 16px -apple-system, sans-serif';ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);ctx.restore();}
  if(state==='sessionDone') drawDone();
}

function loop(){ update(); ctx.clearRect(0,0,W,H); render(); requestAnimationFrame(loop); }

// Input
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();onPress();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();onRelease();}});
canvas.addEventListener('mousedown',onPress);
canvas.addEventListener('mouseup',onRelease);
canvas.addEventListener('mouseleave',onRelease);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onPress();});
canvas.addEventListener('touchend',e=>{e.preventDefault();onRelease();});

function resetGame(){globalRep=0;score=0;displayScore=0;combo=0;fieldGrowth=0;holding=false;holdGlow=0;fallingFruits=[];segments=[];initField();init();updateHUD();state='play';}

document.getElementById('go-btn').addEventListener('click',()=>{
  document.getElementById('start-overlay').style.display='none';
  state = 'play'; initField(); init(); loop();
});
</script>
</body>
</html>

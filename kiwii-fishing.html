<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwii Power — 捕鱼达人</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a1628;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  overflow: hidden; user-select: none;
}
canvas { border-radius: 12px; cursor: pointer; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10;
}
.hi {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 7px 16px; border-radius: 14px; font-size: 15px; color: #ccc;
}
.hi span { font-weight: 600; }
.hi .g { color: #7aff7a; }
.hi .y { color: #ffd700; }
#start-overlay {
  position: fixed; inset: 0; background: rgba(4,10,24,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 16px;
}
#start-overlay h1 { color: #fff; font-size: 36px; font-weight: 300; }
#start-overlay p { color: #aaa; font-size: 17px; max-width: 460px; text-align: center; line-height: 2.2; }
#start-overlay strong { color: #4dc9f6; }
#go-btn {
  margin-top: 14px; padding: 14px 40px; font-size: 16px;
  background: #1a6090; color: #fff; border: none; border-radius: 24px; cursor: pointer;
}
#go-btn:active { transform: scale(0.95); }
#btm { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; z-index: 10; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>🐟 捕鱼达人</h1>
  <p>
    <strong style="color:#fff;font-size:15px">本质：区域判断 × 耐心等待</strong><br>
    <span style="color:#aaa;font-size:13px">下网捕鱼，一网多鱼！等鱼群聚拢再出手 — 训练延迟满足和空间判断</span><br><br>
    光标自动扫描水面，显示当前下网位置<br>
    <strong>空格 / 点击 = 下网!</strong><br><br>
    🐟🐠 普通 · 🐡🦐 优秀 · 🐙🦑 稀有 · 🐋🐉 传说<br><br>
    <span style="color:#888;font-size:14px;line-height:1.8">
    ▸ 前期：中网，🪼水母从一开始就有，学会避开<br>
    ▸ 中期：网缩小，🌟金色鱼(×3)出现<br>
    ▸ 后期：小网(精准)，好坏混杂，时机和位置都是关键<br><br>
    ▸ <span style="color:#aaa">扩展方向：不同网具选择、鱼群AI聚散、海域探索、boss鱼</span>
    </span>
  </p>
  <button id="go-btn">开捕</button>
</div>

<div id="hud">
  <div class="hi">动作 <span class="g" id="h-mv">1/4</span></div>
  <div class="hi">Rep <span class="g" id="h-rp">0/10</span></div>
  <div class="hi">分 <span class="y" id="h-sc">0</span></div>
  <div class="hi">网 <span class="g" id="h-net">大</span></div>
</div>
<div id="btm">空格/点击 = 下网 · 一网能兜多条鱼!</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(960, window.innerWidth - 20);
const H = Math.min(640, window.innerHeight - 20);
canvas.width = W; canvas.height = H;

const TOTAL_REPS = 40;
const WATER_TOP = 70;
const NET_DROP_SPEED = 5;

const FISH = [
  { emoji: '🐟', tier: 1, pts: 8, sz: 26, spd: 0.4, w: 30 },
  { emoji: '🐠', tier: 1, pts: 10, sz: 24, spd: 0.5, w: 25 },
  { emoji: '🦐', tier: 2, pts: 18, sz: 20, spd: 0.6, w: 16 },
  { emoji: '🐡', tier: 2, pts: 22, sz: 28, spd: 0.35, w: 14 },
  { emoji: '🦀', tier: 2, pts: 20, sz: 24, spd: 0.45, w: 13 },
  { emoji: '🐙', tier: 3, pts: 35, sz: 32, spd: 0.5, w: 7 },
  { emoji: '🦑', tier: 3, pts: 40, sz: 30, spd: 0.6, w: 6 },
  { emoji: '🦈', tier: 3, pts: 50, sz: 38, spd: 0.7, w: 4 },
  { emoji: '🐋', tier: 4, pts: 70, sz: 46, spd: 0.3, w: 2 },
  { emoji: '🐉', tier: 4, pts: 100, sz: 42, spd: 0.5, w: 1 },
];
const BAD = { emoji: '🪼', tier: -1, pts: -25, sz: 28, spd: 0.25 };

const TIER_COL = { 1: '#88ccff', 2: '#66eebb', 3: '#bb88ff', 4: '#ffd700', '-1': '#ff4444' };

let state = 'idle';
let globalRep = 0, score = 0, combo = 0;
let cursorX = W / 2, cursorDir = 1, cursorSpeed = 1.2;
let fishes = [];
let activeNet = null; // { x, y, w, h, dropping, catching, catchTimer, caught }
let particles = [], feedbacks = [];
let frame = 0;

function t() { return globalRep / (TOTAL_REPS - 1); }

function getNetWidth() {
  const p = t();
  // Base shrinks dramatically: 220 → 160 → 90 → 40
  let base;
  if (p < 0.25) base = 220;
  else if (p < 0.5) base = 160;
  else if (p < 0.75) base = 90;
  else base = 40;
  // Random fluctuation ±25% so each cast feels different
  const wobble = 0.75 + Math.random() * 0.5;
  return Math.round(base * wobble);
}
function getNetLabel() {
  const p = t();
  if (p < 0.25) return '大';
  if (p < 0.5) return '中';
  if (p < 0.75) return '小';
  return '精准';
}

function spawnFish(inView) {
  const p = t();
  // Bad fish always present — 25% base, grows to 40%
  const badChance = 0.25 + p * 0.15;
  if (Math.random() < badChance) {
    const fromL = Math.random() > 0.5;
    fishes.push({
      ...BAD,
      x: inView ? 80 + Math.random() * (W - 160) : (fromL ? -35 : W + 35),
      y: WATER_TOP + 40 + Math.random() * (H - WATER_TOP - 120),
      vx: BAD.spd * (0.4 + p * 0.4) * (fromL ? 1 : -1),
      vy: 0, golden: false, wobble: Math.random() * 6,
    });
    return;
  }
  // Weighted pick
  const pool = FISH.map(f => ({ ...f, weight: f.w + (f.tier >= 3 ? p * 5 : 0) }));
  const total = pool.reduce((s, f) => s + f.weight, 0);
  let r = Math.random() * total;
  let pick = pool[0];
  for (const f of pool) { r -= f.weight; if (r <= 0) { pick = f; break; } }

  const fromL = Math.random() > 0.5;
  const spdMult = 0.5 + p * 0.5;
  const golden = pick.tier > 0 && p > 0.3 && Math.random() < (p - 0.3) * 0.18;
  fishes.push({
    ...pick,
    x: inView ? 80 + Math.random() * (W - 160) : (fromL ? -35 : W + 35),
    y: WATER_TOP + 40 + Math.random() * (H - WATER_TOP - 120),
    vx: pick.spd * spdMult * (fromL ? 1 : -1),
    vy: (Math.random() - 0.5) * 0.15,
    golden, wobble: Math.random() * 6,
  });
}

function getNetHeight() {
  const p = t();
  // Net height also shrinks: ~200 → 160 → 120 → 80
  let base;
  if (p < 0.25) base = 200;
  else if (p < 0.5) base = 160;
  else if (p < 0.75) base = 120;
  else base = 80;
  const wobble = 0.8 + Math.random() * 0.4;
  return Math.round(base * wobble);
}

function castNet() {
  if (globalRep >= TOTAL_REPS || activeNet) return;
  const nw = getNetWidth();
  const nh = getNetHeight();
  // Net drops from cursor's vertical position (centered around middle of water)
  const dropY = WATER_TOP + 20;
  activeNet = {
    x: cursorX - nw / 2,
    y: dropY,
    w: nw,
    h: 0,
    targetH: nh,
    dropping: true,
    catching: false,
    catchTimer: 0,
    caught: [],
  };
  globalRep++;
  updateHUD();
  if (globalRep >= TOTAL_REPS && !activeNet.dropping) {
    setTimeout(() => { state = 'done'; }, 600);
  }
}

function netFinishDrop() {
  activeNet.dropping = false;
  activeNet.catching = true;
  // Check which fish are inside the net area
  const nx1 = activeNet.x, nx2 = activeNet.x + activeNet.w;
  const ny1 = activeNet.y, ny2 = activeNet.y + activeNet.h;
  const caught = [];
  fishes = fishes.filter(f => {
    if (f.x > nx1 && f.x < nx2 && f.y > ny1 && f.y < ny2) {
      caught.push(f);
      return false;
    }
    return true;
  });
  activeNet.caught = caught;
  activeNet.catchTimer = 0;
}

function netFinishCatch() {
  const caught = activeNet.caught;
  if (caught.length === 0) {
    combo = 0;
    addFeedback('空网!', activeNet.x + activeNet.w / 2, H / 2, '#666');
  } else {
    let totalPts = 0;
    let hasBad = false;
    for (const f of caught) {
      if (f.tier === -1) {
        hasBad = true;
        totalPts += f.pts;
      } else {
        combo++;
        const mult = (f.golden ? 3 : 1);
        totalPts += Math.round(f.pts * mult);
      }
    }
    // Multi-catch bonus
    const multiBonus = caught.filter(f => f.tier > 0).length >= 3 ? Math.round(totalPts * 0.5) : 0;
    totalPts += multiBonus;

    if (hasBad) { combo = 0; }
    score = Math.max(0, score + totalPts);

    const cx = activeNet.x + activeNet.w / 2;
    const goodCount = caught.filter(f => f.tier > 0).length;
    if (goodCount >= 3) {
      addFeedback(`🎣 一网${goodCount}条! +${totalPts}`, cx, H / 2 - 40, '#ffd700');
      spawnP(cx, H / 2, '#ffd700', 20);
    } else if (totalPts > 0) {
      addFeedback(`+${totalPts}`, cx, H / 2 - 20, '#88ccff');
    }
    if (hasBad) {
      addFeedback('🪼 水母入网!', cx, H / 2 + 20, '#ff4444');
    }
    // Individual fish feedback
    let fy = H / 2 - 60;
    for (const f of caught) {
      const col = TIER_COL[f.tier] || '#888';
      spawnP(cx + (Math.random() - 0.5) * 60, fy, col, 5);
      fy += 25;
    }
  }
  updateHUD();
  activeNet = null;
  if (globalRep >= TOTAL_REPS) {
    setTimeout(() => { state = 'done'; }, 400);
  }
}

function updateHUD() {
  document.getElementById('h-mv').textContent = `${Math.min(Math.floor(globalRep / 10) + 1, 4)}/4`;
  document.getElementById('h-rp').textContent = `${globalRep % 10}/10`;
  document.getElementById('h-sc').textContent = score;
  document.getElementById('h-net').textContent = getNetLabel();
}

function update() {
  if (state !== 'play' && state !== 'done') return;
  frame++;

  // Cursor sweep
  if (!activeNet) {
    cursorSpeed = 1.0 + t() * 0.6;
    cursorX += cursorSpeed * cursorDir;
    if (cursorX > W - 40) { cursorX = W - 40; cursorDir = -1; }
    if (cursorX < 40) { cursorX = 40; cursorDir = 1; }
  }

  // Spawn
  const spawnRate = Math.max(18, 45 - Math.floor(t() * 25));
  if (frame % spawnRate === 0 && fishes.length < 12 + t() * 5) {
    spawnFish(false);
  }

  // Fish movement
  for (const f of fishes) {
    f.wobble += 0.03;
    f.x += f.vx;
    f.y += f.vy + Math.sin(f.wobble) * 0.15;
    if (f.y < WATER_TOP + 30) f.vy += 0.05;
    if (f.y > H - 60) f.vy -= 0.05;
    f.vy *= 0.98;
  }
  fishes = fishes.filter(f => f.x > -70 && f.x < W + 70);

  // Net animation
  if (activeNet) {
    if (activeNet.dropping) {
      activeNet.h += NET_DROP_SPEED;
      if (activeNet.h >= activeNet.targetH) {
        activeNet.h = activeNet.targetH;
        netFinishDrop();
      }
    } else if (activeNet.catching) {
      activeNet.catchTimer++;
      if (activeNet.catchTimer > 35) {
        netFinishCatch();
      }
    }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.life -= 0.018; });
  particles = particles.filter(p => p.life > 0);
  feedbacks.forEach(f => { f.y -= 1; f.life -= 0.012; });
  feedbacks = feedbacks.filter(f => f.life > 0);
}

function spawnP(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1.5, life: 1, color, sz: 2 + Math.random() * 3 });
  }
}
function addFeedback(text, x, y, color) { feedbacks.push({ text, x, y, life: 1.5, color }); }

function render() {
  // BG
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1e3d'); g.addColorStop(0.5, '#0a2040'); g.addColorStop(1, '#061428');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Water surface
  ctx.strokeStyle = 'rgba(77,201,246,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 5) {
    const y = WATER_TOP + Math.sin(x * 0.015 + frame * 0.02) * 3;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Net preview (cursor zone)
  if (!activeNet && state === 'play') {
    const nw = getNetWidth();
    const nh = getNetHeight();
    const nx = cursorX - nw / 2;
    const ny = WATER_TOP + 20;
    ctx.strokeStyle = 'rgba(77,201,246,0.4)'; ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(nx, ny, nw, nh);
    ctx.setLineDash([]);
    // Net size indicator at top
    ctx.fillStyle = 'rgba(77,201,246,0.15)';
    ctx.fillRect(nx, ny, nw, nh);
    // Count fish in zone
    const fishInZone = fishes.filter(f => f.x > nx && f.x < nx + nw && f.y > ny && f.y < ny + nh).length;
    const badInZone = fishes.filter(f => f.tier === -1 && f.x > nx && f.x < nx + nw && f.y > ny && f.y < ny + nh).length;
    if (fishInZone > 0) {
      ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = fishInZone >= 3 ? '#ffd700' : '#4dc9f6';
      let label = `${fishInZone} 条`;
      if (badInZone > 0) label += ` (${badInZone}🪼)`;
      ctx.fillText(label, cursorX, WATER_TOP + 10);
    }
  }

  // Active net dropping
  if (activeNet) {
    ctx.save();
    if (activeNet.catching) {
      ctx.globalAlpha = 1 - activeNet.catchTimer / 40;
    }
    // Net area
    ctx.strokeStyle = 'rgba(77,201,246,0.7)'; ctx.lineWidth = 2;
    ctx.strokeRect(activeNet.x, WATER_TOP, activeNet.w, activeNet.h);
    // Net mesh lines
    ctx.strokeStyle = 'rgba(77,201,246,0.3)'; ctx.lineWidth = 1;
    const meshGap = 25;
    for (let mx = activeNet.x + meshGap; mx < activeNet.x + activeNet.w; mx += meshGap) {
      ctx.beginPath(); ctx.moveTo(mx, WATER_TOP); ctx.lineTo(mx, WATER_TOP + activeNet.h); ctx.stroke();
    }
    for (let my = WATER_TOP + meshGap; my < WATER_TOP + activeNet.h; my += meshGap) {
      ctx.beginPath(); ctx.moveTo(activeNet.x, my); ctx.lineTo(activeNet.x + activeNet.w, my); ctx.stroke();
    }
    // Caught fish inside net
    if (activeNet.catching) {
      for (const f of activeNet.caught) {
        ctx.font = `${f.sz}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(f.emoji, f.x, f.y);
      }
    }
    ctx.restore();
  }

  // Fish
  for (const f of fishes) {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.golden) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 10; }
    if (f.tier === -1) { ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8; }
    ctx.scale(f.vx < 0 ? -1 : 1, 1);
    ctx.font = `${f.sz}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, 0, 0);
    if (f.golden) {
      ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText('×3', 0, -f.sz * 0.5);
    }
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.5, p.sz * p.life), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Feedbacks
  for (const f of feedbacks) {
    ctx.globalAlpha = Math.min(1, Math.max(0, f.life));
    ctx.font = 'bold 18px -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // Progress
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(W/2 - 100, H - 10, 200, 4);
  ctx.fillStyle = '#4dc9f6';
  ctx.fillRect(W/2 - 100, H - 10, 200 * (globalRep / TOTAL_REPS), 4);

  // Done
  if (state === 'done') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '26px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('捕鱼结束', W/2, H/2 - 50);
    ctx.font = '22px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText(`总分: ${score}`, W/2, H/2 - 10);
    const grade = score >= 500 ? 'S' : score >= 350 ? 'A' : score >= 200 ? 'B' : 'C';
    const gc = score >= 500 ? '#ffd700' : score >= 350 ? '#7aff7a' : score >= 200 ? '#88aaff' : '#aaa';
    ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = gc; ctx.fillText(grade, W/2, H/2 + 45);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#888'; ctx.fillText('点击重玩', W/2, H/2 + 80);
  }
}

function loop() { update(); ctx.clearRect(0, 0, W, H); render(); requestAnimationFrame(loop); }

function handleInput() {
  if (state === 'done') {
    globalRep = 0; score = 0; combo = 0; cursorX = W/2; cursorDir = 1;
    fishes = []; activeNet = null; particles = []; feedbacks = [];
    state = 'play';
    for (let i = 0; i < 6; i++) spawnFish(true);
    for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) {
      const fromL = Math.random() > 0.5;
      fishes.push({ ...BAD, x: 80 + Math.random() * (W - 160), y: WATER_TOP + 40 + Math.random() * (H - WATER_TOP - 120), vx: BAD.spd * 0.5 * (fromL ? 1 : -1), vy: 0, golden: false, wobble: Math.random() * 6 });
    }
    updateHUD();
    return;
  }
  if (state === 'play') castNet();
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleInput(); } });
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); });

document.getElementById('go-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('start-overlay').style.display = 'none';
  state = 'play';
  for (let i = 0; i < 6; i++) spawnFish(true);
  // Force 2-3 jellyfish in initial spawn
  for (let i = 0; i < 2 + Math.floor(Math.random() * 2); i++) {
    const fromL = Math.random() > 0.5;
    fishes.push({
      ...BAD,
      x: 80 + Math.random() * (W - 160),
      y: WATER_TOP + 40 + Math.random() * (H - WATER_TOP - 120),
      vx: BAD.spd * (0.4 + Math.random() * 0.3) * (fromL ? 1 : -1),
      vy: 0, golden: false, wobble: Math.random() * 6,
    });
  }
  updateHUD();
  loop();
});
</script>
</body>
</html>

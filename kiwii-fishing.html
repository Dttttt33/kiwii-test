<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwii Power — 捕鱼达人</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a1628;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  overflow: hidden; user-select: none;
}
canvas { border-radius: 12px; cursor: crosshair; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10;
}
.hi {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 7px 16px; border-radius: 14px; font-size: 15px; color: #ccc;
}
.hi span { font-weight: 600; }
.hi .g { color: #7aff7a; }
.hi .y { color: #ffd700; }
#start-overlay {
  position: fixed; inset: 0; background: rgba(4,10,24,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 16px;
}
#start-overlay h1 { color: #fff; font-size: 36px; font-weight: 300; }
#start-overlay p { color: #aaa; font-size: 17px; max-width: 460px; text-align: center; line-height: 2.2; }
#start-overlay strong { color: #4dc9f6; }
#go-btn {
  margin-top: 14px; padding: 14px 40px; font-size: 16px;
  background: #1a6090; color: #fff; border: none; border-radius: 24px; cursor: pointer;
}
#go-btn:active { transform: scale(0.95); }
#btm { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; z-index: 10; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>🐟 捕鱼达人</h1>
  <p>
    <strong style="color:#fff;font-size:15px">本质：瞄准精度 × 资源管理</strong><br>
    <span style="color:#aaa;font-size:13px">40 发有限弹药，每一下发力都要选好目标 — 训练有限资源下的最优选择</span><br><br>
    炮台自动旋转瞄准<br>
    <strong>空格 / 点击 = 发射渔网!</strong><br><br>
    🐟🐠 普通 · 🐡🦐 优秀<br>
    🐙🦑 稀有 · 🐋🐉 传说<br><br>
    <span style="color:#888;font-size:14px;line-height:1.8">
    ▸ 前期：鱼慢、网大，练习瞄准节奏<br>
    ▸ 中期：🌟金色鱼(×3) + 闪避鱼(会躲!)<br>
    ▸ 后期：🪼水母扣分、网越来越小、鱼加速<br><br>
    ▸ <span style="color:#aaa">扩展方向：不同武器(鱼叉/电网)、海域探索、钓鱼排行赛、boss 鱼</span>
    </span>
  </p>
  <button id="go-btn">开炮</button>
</div>

<div id="hud">
  <div class="hi">动作 <span class="g" id="h-mv">1/4</span></div>
  <div class="hi">Rep <span class="g" id="h-rp">0/10</span></div>
  <div class="hi">分 <span class="y" id="h-sc">0</span></div>
  <div class="hi">连击 <span class="y" id="h-cb">—</span></div>
</div>
<div id="btm">空格/点击 = 发射 · 瞄准时机是关键</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(960, window.innerWidth - 20);
const H = Math.min(640, window.innerHeight - 20);
canvas.width = W; canvas.height = H;

const TOTAL_REPS = 40;
const CANNON_X = W / 2;
const CANNON_Y = H - 50;

const FISH = [
  { emoji: '🐟', tier: 1, pts: 10, sz: 28, spd: 0.5 },
  { emoji: '🐠', tier: 1, pts: 12, sz: 26, spd: 0.6 },
  { emoji: '🦐', tier: 2, pts: 20, sz: 22, spd: 0.7 },
  { emoji: '🐡', tier: 2, pts: 25, sz: 30, spd: 0.4 },
  { emoji: '🦀', tier: 2, pts: 22, sz: 26, spd: 0.5 },
  { emoji: '🐙', tier: 3, pts: 40, sz: 34, spd: 0.6 },
  { emoji: '🦑', tier: 3, pts: 45, sz: 32, spd: 0.7 },
  { emoji: '🦈', tier: 3, pts: 50, sz: 40, spd: 0.8 },
  { emoji: '🐋', tier: 4, pts: 80, sz: 48, spd: 0.4 },
  { emoji: '🐉', tier: 4, pts: 100, sz: 44, spd: 0.6 },
];
const BAD = [
  { emoji: '🪼', tier: -1, pts: -30, sz: 30, spd: 0.3 },
];

let state = 'idle';
let globalRep = 0, score = 0, combo = 0;
let angle = 0, angleDir = 1;
let fishes = [], bullets = [];
let particles = [], feedbacks = [];
let frame = 0;

function progress() { return globalRep / (TOTAL_REPS - 1); }

function spawnFish(inView) {
  const t = progress();
  const weights = [30,25,18,15,14,8,7,5,3,2];
  // Boost rares later
  const pool = FISH.map((f, i) => ({ ...f, w: weights[i] + (f.tier >= 3 ? t * 6 : 0) }));
  // Bad fish after 40%
  if (t > 0.4 && Math.random() < (t - 0.4) * 0.3) {
    const b = BAD[0];
    const fromL = Math.random() > 0.5;
    fishes.push({
      ...b, x: inView ? 100 + Math.random() * (W - 200) : (fromL ? -40 : W + 40),
      y: 80 + Math.random() * (H - 200),
      vx: b.spd * (0.5 + t * 0.5) * (fromL ? 1 : -1),
      vy: 0, golden: false, wobble: Math.random() * 6,
    });
    return;
  }
  const total = pool.reduce((s, f) => s + f.w, 0);
  let r = Math.random() * total;
  let pick = pool[0];
  for (const f of pool) { r -= f.w; if (r <= 0) { pick = f; break; } }

  const fromL = Math.random() > 0.5;
  const spdMult = 0.5 + t * 0.6;
  const golden = pick.tier > 0 && t > 0.3 && Math.random() < (t - 0.3) * 0.2;
  fishes.push({
    ...pick,
    x: inView ? 100 + Math.random() * (W - 200) : (fromL ? -40 : W + 40),
    y: 80 + Math.random() * (H - 200),
    vx: pick.spd * spdMult * (fromL ? 1 : -1),
    vy: (Math.random() - 0.5) * 0.2,
    golden, wobble: Math.random() * 6,
  });
}

function fire() {
  if (globalRep >= TOTAL_REPS) return;
  const t = progress();
  const netR = Math.max(20, 35 - t * 15);
  bullets.push({
    x: CANNON_X, y: CANNON_Y - 25,
    vx: Math.sin(angle) * 6, vy: -Math.cos(angle) * 6,
    r: netR, age: 0,
  });
  globalRep++;
  updateHUD();
  if (globalRep >= TOTAL_REPS) setTimeout(() => { state = 'done'; }, 800);
}

function updateHUD() {
  document.getElementById('h-mv').textContent = `${Math.min(Math.floor(globalRep / 10) + 1, 4)}/4`;
  document.getElementById('h-rp').textContent = `${globalRep % 10}/10`;
  document.getElementById('h-sc').textContent = score;
  document.getElementById('h-cb').textContent = combo > 0 ? `×${combo}` : '—';
}

function update() {
  if (state !== 'play' && state !== 'done') return;
  frame++;

  // Cannon rotation — slow sweep
  const t = progress();
  const speed = 0.004 + t * 0.004;
  angle += speed * angleDir;
  if (angle > 1.2) { angle = 1.2; angleDir = -1; }
  if (angle < -1.2) { angle = -1.2; angleDir = 1; }

  // Spawn fish
  if (frame % Math.max(20, 50 - Math.floor(t * 30)) === 0 && fishes.length < 10 + t * 5) {
    spawnFish(false);
  }

  // Move fish
  for (const f of fishes) {
    f.wobble += 0.03;
    f.x += f.vx;
    f.y += f.vy + Math.sin(f.wobble) * 0.2;
    if (f.y < 70) f.vy = Math.abs(f.vy) + 0.1;
    if (f.y > H - 80) f.vy = -(Math.abs(f.vy) + 0.1);
  }
  fishes = fishes.filter(f => f.x > -80 && f.x < W + 80);

  // Move bullets
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; b.age++; }
  bullets = bullets.filter(b => b.age < 100 && b.y > -50 && b.x > -50 && b.x < W + 50);

  // Collision
  for (let bi = bullets.length - 1; bi >= 0; bi--) {
    const b = bullets[bi];
    for (let fi = fishes.length - 1; fi >= 0; fi--) {
      const f = fishes[fi];
      const dx = b.x - f.x, dy = b.y - f.y;
      if (dx * dx + dy * dy < (b.r + f.sz * 0.4) * (b.r + f.sz * 0.4)) {
        // Hit!
        bullets.splice(bi, 1);
        fishes.splice(fi, 1);
        if (f.tier === -1) {
          score = Math.max(0, score + f.pts);
          combo = 0;
          addFeedback(`${f.emoji} ${f.pts}`, f.x, f.y - 20, '#ff4444');
          spawnP(f.x, f.y, '#ff4444', 8);
        } else {
          combo++;
          const mult = (f.golden ? 3 : 1) * (1 + Math.min(combo - 1, 9) * 0.1);
          const pts = Math.round(f.pts * mult);
          score += pts;
          const col = f.tier >= 4 ? '#ffd700' : f.tier >= 3 ? '#bb88ff' : f.tier >= 2 ? '#66eebb' : '#88ccff';
          addFeedback(`${f.emoji}${f.golden ? '🌟' : ''} +${pts}`, f.x, f.y - 20, col);
          spawnP(f.x, f.y, col, 8 + f.tier * 4);
          if (f.golden) spawnP(f.x, f.y, '#ffd700', 10);
        }
        updateHUD();
        break;
      }
    }
  }

  // Missed bullets
  for (const b of bullets) {
    if (b.y < -40 && !b.missed) { b.missed = true; combo = 0; updateHUD(); }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.02; });
  particles = particles.filter(p => p.life > 0);
  feedbacks.forEach(f => { f.y -= 1.2; f.life -= 0.015; });
  feedbacks = feedbacks.filter(f => f.life > 0);
}

function spawnP(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 3;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 1.5, life: 1, color, sz: 2 + Math.random() * 3 });
  }
}
function addFeedback(text, x, y, color) { feedbacks.push({ text, x, y, life: 1.2, color }); }

function render() {
  // Background
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a1e3d'); g.addColorStop(0.5, '#0a2040'); g.addColorStop(1, '#061428');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Water surface line
  ctx.strokeStyle = 'rgba(77,201,246,0.25)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 5) {
    const y = 60 + Math.sin(x * 0.015 + frame * 0.02) * 3;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Fish
  for (const f of fishes) {
    ctx.save();
    ctx.translate(f.x, f.y);
    if (f.golden) {
      ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12;
    }
    if (f.tier === -1) {
      ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8;
    }
    ctx.scale(f.vx < 0 ? -1 : 1, 1);
    ctx.font = `${f.sz}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(f.emoji, 0, 0);
    if (f.golden) {
      ctx.font = 'bold 11px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText('×3', 0, -f.sz * 0.55);
    }
    ctx.restore();
  }

  // Bullets (nets)
  for (const b of bullets) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.strokeStyle = 'rgba(77,201,246,0.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, b.r * 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-b.r*0.35, -b.r*0.35); ctx.lineTo(b.r*0.35, b.r*0.35);
    ctx.moveTo(b.r*0.35, -b.r*0.35); ctx.lineTo(-b.r*0.35, b.r*0.35);
    ctx.moveTo(0, -b.r*0.5); ctx.lineTo(0, b.r*0.5);
    ctx.stroke();
    ctx.restore();
  }

  // Cannon
  ctx.save();
  ctx.translate(CANNON_X, CANNON_Y);
  // Aim line
  ctx.save(); ctx.rotate(angle);
  ctx.strokeStyle = 'rgba(77,201,246,0.2)'; ctx.lineWidth = 1; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(0, -H); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  // Base
  ctx.fillStyle = '#2a3a50';
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#4a6a90'; ctx.lineWidth = 2; ctx.stroke();
  // Barrel
  ctx.save(); ctx.rotate(angle);
  ctx.fillStyle = '#4a7a9a'; ctx.fillRect(-6, -40, 12, 30);
  ctx.fillStyle = '#4dc9f6'; ctx.beginPath(); ctx.arc(0, -40, 4, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // Ammo count
  ctx.fillStyle = '#1a2a3a'; ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();
  ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = (TOTAL_REPS - globalRep) <= 5 ? '#ff6644' : '#4dc9f6';
  ctx.fillText(TOTAL_REPS - globalRep, 0, 0);
  ctx.restore();

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.sz * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Feedbacks
  for (const f of feedbacks) {
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.font = 'bold 18px -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // Progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(W/2 - 100, H - 10, 200, 4);
  ctx.fillStyle = '#4dc9f6';
  ctx.fillRect(W/2 - 100, H - 10, 200 * (globalRep / TOTAL_REPS), 4);

  // Done screen
  if (state === 'done') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '26px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('捕鱼结束', W/2, H/2 - 50);
    ctx.font = '22px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText(`总分: ${score}`, W/2, H/2 - 10);
    const grade = score >= 600 ? 'S' : score >= 400 ? 'A' : score >= 250 ? 'B' : 'C';
    const gc = score >= 600 ? '#ffd700' : score >= 400 ? '#7aff7a' : score >= 250 ? '#88aaff' : '#aaa';
    ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = gc; ctx.fillText(grade, W/2, H/2 + 45);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#888'; ctx.fillText('点击重玩', W/2, H/2 + 80);
  }
}

function loop() { update(); ctx.clearRect(0, 0, W, H); render(); requestAnimationFrame(loop); }

function handleInput() {
  if (state === 'done') { globalRep=0; score=0; combo=0; angle=0; angleDir=1; fishes=[]; bullets=[]; particles=[]; feedbacks=[]; state='play'; updateHUD(); return; }
  if (state === 'play') fire();
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleInput(); } });
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); });

document.getElementById('go-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('start-overlay').style.display = 'none';
  state = 'play';
  for (let i = 0; i < 6; i++) spawnFish(true);
  updateHUD();
  loop();
});
</script>
</body>
</html>

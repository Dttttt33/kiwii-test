<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiwii Power — 挖矿寻宝</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0c04;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh;
  font-family: -apple-system, 'SF Pro Display', sans-serif;
  overflow: hidden; user-select: none;
}
canvas { border-radius: 12px; cursor: pointer; }
#hud {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; z-index: 10;
}
.hi {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  padding: 7px 16px; border-radius: 14px; font-size: 15px; color: #ccc;
}
.hi span { font-weight: 600; }
.hi .g { color: #7aff7a; }
.hi .y { color: #ffd700; }
#start-overlay {
  position: fixed; inset: 0; background: rgba(6,4,2,0.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; gap: 16px;
}
#start-overlay h1 { color: #fff; font-size: 36px; font-weight: 300; }
#start-overlay p { color: #aaa; font-size: 17px; max-width: 480px; text-align: center; line-height: 2.2; }
#start-overlay strong { color: #ffd700; }
#go-btn {
  margin-top: 14px; padding: 14px 40px; font-size: 16px;
  background: #6a4a1a; color: #fff; border: none; border-radius: 24px; cursor: pointer;
}
#go-btn:active { transform: scale(0.95); }
#btm { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.3); font-size: 13px; z-index: 10; }
</style>
</head>
<body>

<div id="start-overlay">
  <h1>⛏️ 挖矿寻宝</h1>
  <p>
    <strong style="color:#fff;font-size:15px">本质：风险深度 × 换道决策</strong><br>
    <span style="color:#aaa;font-size:13px">越挖越深 = 越稀有，但炸弹也越多 — 何时换列是核心策略</span><br><br>
    光标在 5 条矿道上扫描<br>
    <strong>空格 / 点击 = 在当前列往下挖一格!</strong><br><br>
    <span style="color:#888;font-size:14px;line-height:1.8">
    ▸ 第 1-2 层（土层）：🥕🥔🌽 蔬菜，安全<br>
    ▸ 第 3-4 层（石层）：🍓🍇🍑 水果 + 少量💣<br>
    ▸ 第 5-6 层（深层）：🍉🎃🌻 大奖 + 更多💣<br>
    ▸ 第 7+ 层（矿脉）：💎🌈 传说! 但💣概率 40%<br><br>
    ▸ 挖到💣：该列炸毁重置到第 1 层，扣 30 分<br>
    ▸ <span style="color:#aaa">策略：看到下层发紫光/金光就继续挖，看到红光就换列!</span>
    </span>
  </p>
  <button id="go-btn">开挖</button>
</div>

<div id="hud">
  <div class="hi">动作 <span class="g" id="h-mv">1/4</span></div>
  <div class="hi">Rep <span class="g" id="h-rp">0/10</span></div>
  <div class="hi">分 <span class="y" id="h-sc">0</span></div>
</div>
<div id="btm">空格/点击 = 往下挖一格 · 不按 = 跳过该列</div>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = Math.min(960, window.innerWidth - 20);
const H = Math.min(640, window.innerHeight - 20);
canvas.width = W; canvas.height = H;

const COLS = 5;
const COL_W = 100;
const COL_GAP = (W - COLS * COL_W) / (COLS + 1);
const GRID_TOP = 80;
const CELL_H = 56;
const VISIBLE_ROWS = 8;
const TOTAL_REPS = 40;

const TIER_COLORS = {
  1: { glow: '#66aa44', bg: '#3a5a2a' },
  2: { glow: '#4488dd', bg: '#2a3a5a' },
  3: { glow: '#aa55ff', bg: '#3a2a5a' },
  4: { glow: '#ffd700', bg: '#4a3a1a' },
  '-1': { glow: '#ff2200', bg: '#4a1a1a' },
  0: { glow: '#666', bg: '#2a2a2a' },
};

const LAYER_ITEMS = [
  // Layer 0-1: soil — safe common stuff
  [
    { emoji: '🥕', pts: 8, tier: 1, w: 25 },
    { emoji: '🥔', pts: 6, tier: 1, w: 25 },
    { emoji: '🌽', pts: 10, tier: 1, w: 20 },
    { emoji: '🧅', pts: 7, tier: 1, w: 20 },
    { emoji: '🪨', pts: 2, tier: 0, w: 10 },
  ],
  // Layer 2-3: stone — good stuff + low bomb chance
  [
    { emoji: '🍅', pts: 16, tier: 2, w: 20 },
    { emoji: '🍓', pts: 20, tier: 2, w: 18 },
    { emoji: '🍇', pts: 22, tier: 2, w: 15 },
    { emoji: '🍑', pts: 24, tier: 2, w: 12 },
    { emoji: '🥕', pts: 8, tier: 1, w: 10 },
    { emoji: '💣', pts: -30, tier: -1, w: 8 },
  ],
  // Layer 4-5: deep — rare + more bombs
  [
    { emoji: '🍉', pts: 40, tier: 3, w: 15 },
    { emoji: '🎃', pts: 45, tier: 3, w: 12 },
    { emoji: '🌻', pts: 38, tier: 3, w: 12 },
    { emoji: '🍓', pts: 20, tier: 2, w: 10 },
    { emoji: '💣', pts: -30, tier: -1, w: 18 },
  ],
  // Layer 6+: vein — legendary + high bomb
  [
    { emoji: '💎', pts: 80, tier: 4, w: 12 },
    { emoji: '🌈', pts: 100, tier: 4, w: 8 },
    { emoji: '🍉', pts: 40, tier: 3, w: 12 },
    { emoji: '🌻', pts: 38, tier: 3, w: 10 },
    { emoji: '💣', pts: -30, tier: -1, w: 25 },
  ],
];

function getLayerPool(depth) {
  if (depth < 2) return LAYER_ITEMS[0];
  if (depth < 4) return LAYER_ITEMS[1];
  if (depth < 6) return LAYER_ITEMS[2];
  return LAYER_ITEMS[3];
}

function pickItem(depth) {
  const pool = getLayerPool(depth);
  const total = pool.reduce((s, i) => s + i.w, 0);
  let r = Math.random() * total;
  for (const item of pool) { r -= item.w; if (r <= 0) return { ...item }; }
  return { ...pool[0] };
}

// State
let state = 'idle';
let globalRep = 0, score = 0;
let columns = []; // each col: { depth, cells: [{item, revealed}] }
let cursorX = 0, cursorDir = 1, cursorSpeed = 1.5;
let repActive = false, struck = false, repTimer = 0;
let particles = [], feedbacks = [];
let shakeX = 0, shakeY = 0;
let flashAlpha = 0, flashColor = '';
let frame = 0;

function colX(i) { return COL_GAP + i * (COL_W + COL_GAP); }

function initColumns() {
  columns = [];
  for (let i = 0; i < COLS; i++) {
    const cells = [];
    for (let d = 0; d < VISIBLE_ROWS + 2; d++) {
      cells.push({ item: pickItem(d), revealed: false });
    }
    columns.push({ depth: 0, cells });
  }
}

function resetColumn(ci) {
  const col = columns[ci];
  col.depth = 0;
  col.cells = [];
  for (let d = 0; d < VISIBLE_ROWS + 2; d++) {
    col.cells.push({ item: pickItem(d), revealed: false });
  }
}

function digColumn(ci) {
  const col = columns[ci];
  const cell = col.cells[col.depth];
  if (!cell) return;

  cell.revealed = true;
  const item = cell.item;
  const cx = colX(ci) + COL_W / 2;
  const cy = GRID_TOP + col.depth * CELL_H + CELL_H / 2;

  if (item.tier === -1) {
    // BOMB!
    score = Math.max(0, score + item.pts);
    flashAlpha = 0.4; flashColor = '#ff2200';
    shakeX = (Math.random() - 0.5) * 16; shakeY = (Math.random() - 0.5) * 10;
    spawnP(cx, cy, '#ff4400', 20);
    spawnP(cx, cy, '#ffaa00', 12);
    addFeedback(`💥 炸了! ${item.pts}`, cx, cy - 30, '#ff4444');
    // Reset this column
    setTimeout(() => resetColumn(ci), 400);
  } else {
    score += item.pts;
    const tc = TIER_COLORS[item.tier] || TIER_COLORS[0];
    spawnP(cx, cy, tc.glow, 6 + item.tier * 3);
    if (item.tier >= 3) {
      flashAlpha = 0.15; flashColor = tc.glow;
      shakeX = (Math.random() - 0.5) * 5;
      addFeedback(`${item.emoji} +${item.pts}!`, cx, cy - 30, tc.glow);
    } else if (item.tier >= 2) {
      addFeedback(`${item.emoji} +${item.pts}`, cx, cy - 30, tc.glow);
    } else {
      addFeedback(`+${item.pts}`, cx, cy - 20, '#aaa');
    }
    col.depth++;
    // Generate more cells if needed
    while (col.cells.length <= col.depth + VISIBLE_ROWS) {
      col.cells.push({ item: pickItem(col.cells.length), revealed: false });
    }
  }
  updateHUD();
}

function strike() {
  if (state !== 'play' || !repActive || struck) return;
  struck = true;

  // Which column is cursor over?
  let hitCol = -1;
  for (let i = 0; i < COLS; i++) {
    const cx = colX(i);
    if (cursorX >= cx - 10 && cursorX <= cx + COL_W + 10) { hitCol = i; break; }
  }
  if (hitCol >= 0) digColumn(hitCol);

  repActive = false;
  globalRep++;
  updateHUD();
  if (globalRep >= TOTAL_REPS) { state = 'done'; return; }
  setTimeout(() => { repActive = true; struck = false; repTimer = 0; }, 300);
}

function updateHUD() {
  document.getElementById('h-mv').textContent = `${Math.min(Math.floor(globalRep / 10) + 1, 4)}/4`;
  document.getElementById('h-rp').textContent = `${globalRep % 10}/10`;
  document.getElementById('h-sc').textContent = score;
}

function spawnP(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1.5 + Math.random() * 4;
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 1, color, sz: 2 + Math.random() * 4 });
  }
}
function addFeedback(t, x, y, c) { feedbacks.push({ text: t, x, y, life: 1.5, color: c }); }

function update() {
  if (state !== 'play' && state !== 'done') return;
  frame++;
  shakeX *= 0.85; shakeY *= 0.85;
  if (flashAlpha > 0) flashAlpha -= 0.02;

  if (repActive && !struck) {
    cursorX += cursorSpeed * cursorDir;
    if (cursorX > W - 30) { cursorX = W - 30; cursorDir = -1; }
    if (cursorX < 30) { cursorX = 30; cursorDir = 1; }
    repTimer++;
    if (repTimer > (W - 60) / cursorSpeed) {
      // Missed — no dig this rep
      repActive = false;
      globalRep++;
      updateHUD();
      if (globalRep >= TOTAL_REPS) { state = 'done'; return; }
      setTimeout(() => { repActive = true; struck = false; repTimer = 0; }, 250);
    }
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= 0.018; });
  particles = particles.filter(p => p.life > 0);
  feedbacks.forEach(f => { f.y -= 1.2; f.life -= 0.013; });
  feedbacks = feedbacks.filter(f => f.life > 0);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background — underground gradient
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#2a2010'); bg.addColorStop(0.3, '#1a1508'); bg.addColorStop(1, '#0a0804');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  // Draw columns
  for (let i = 0; i < COLS; i++) {
    const col = columns[i];
    const x = colX(i);

    // Column background shaft
    ctx.fillStyle = 'rgba(30,25,15,0.5)';
    ctx.fillRect(x, GRID_TOP, COL_W, VISIBLE_ROWS * CELL_H);
    ctx.strokeStyle = 'rgba(80,60,30,0.3)'; ctx.lineWidth = 1;
    ctx.strokeRect(x, GRID_TOP, COL_W, VISIBLE_ROWS * CELL_H);

    // Draw cells
    for (let d = 0; d < VISIBLE_ROWS; d++) {
      const actualDepth = col.depth + d;
      const cell = col.cells[actualDepth];
      if (!cell) continue;
      const cy = GRID_TOP + d * CELL_H;

      if (d === 0 && !cell.revealed) {
        // Current dig target — highlighted
        const tc = TIER_COLORS[cell.item.tier] || TIER_COLORS[0];
        // Glow hint
        const pulse = 0.6 + Math.sin(frame * 0.04 + i * 1.2) * 0.3;
        ctx.fillStyle = tc.bg;
        ctx.fillRect(x + 2, cy + 2, COL_W - 4, CELL_H - 4);
        ctx.save();
        ctx.shadowColor = tc.glow; ctx.shadowBlur = 10 * pulse;
        ctx.strokeStyle = tc.glow; ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, cy + 2, COL_W - 4, CELL_H - 4);
        ctx.restore();
        // "?" with tier hint color
        ctx.font = 'bold 22px serif'; ctx.textAlign = 'center';
        ctx.fillStyle = tc.glow;
        ctx.globalAlpha = 0.7;
        ctx.fillText('?', x + COL_W / 2, cy + CELL_H / 2 + 7);
        ctx.globalAlpha = 1;
        // Danger indicator for bombs
        if (cell.item.tier === -1) {
          ctx.font = '12px sans-serif';
          ctx.fillStyle = '#ff4444';
          ctx.fillText('⚠️', x + COL_W / 2, cy + 14);
        }
      } else if (d > 0 && !cell.revealed) {
        // Future cells — dim hint only for next one
        if (d === 1) {
          const tc = TIER_COLORS[cell.item.tier] || TIER_COLORS[0];
          ctx.fillStyle = 'rgba(20,15,10,0.8)';
          ctx.fillRect(x + 2, cy + 2, COL_W - 4, CELL_H - 4);
          ctx.save();
          ctx.globalAlpha = 0.3;
          ctx.shadowColor = tc.glow; ctx.shadowBlur = 6;
          ctx.strokeStyle = tc.glow; ctx.lineWidth = 1;
          ctx.strokeRect(x + 4, cy + 4, COL_W - 8, CELL_H - 8);
          ctx.restore();
        } else {
          // Deeper: just dark
          ctx.fillStyle = `rgba(15,10,5,${0.7 + d * 0.03})`;
          ctx.fillRect(x + 2, cy + 2, COL_W - 4, CELL_H - 4);
        }
      }
    }

    // Depth label under column
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    const depthLabel = col.depth < 2 ? '土层' : col.depth < 4 ? '石层' : col.depth < 6 ? '深层' : '矿脉';
    const depthColor = col.depth < 2 ? '#aa8844' : col.depth < 4 ? '#88aacc' : col.depth < 6 ? '#aa88ff' : '#ffd700';
    ctx.fillStyle = depthColor;
    ctx.fillText(`${depthLabel} (${col.depth})`, x + COL_W / 2, GRID_TOP + VISIBLE_ROWS * CELL_H + 16);
  }

  // Cursor
  if (repActive && !struck) {
    // Highlight column
    for (let i = 0; i < COLS; i++) {
      const cx = colX(i);
      if (cursorX >= cx - 10 && cursorX <= cx + COL_W + 10) {
        ctx.strokeStyle = 'rgba(255,220,60,0.5)'; ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        ctx.strokeRect(cx - 4, GRID_TOP - 4, COL_W + 8, VISIBLE_ROWS * CELL_H + 8);
        ctx.setLineDash([]);
        // Arrow
        ctx.fillStyle = '#ffcc33';
        const ax = cx + COL_W / 2;
        ctx.beginPath(); ctx.moveTo(ax, GRID_TOP - 15); ctx.lineTo(ax - 8, GRID_TOP - 25); ctx.lineTo(ax + 8, GRID_TOP - 25); ctx.closePath(); ctx.fill();
        break;
      }
    }
    // Cursor line
    ctx.strokeStyle = 'rgba(255,210,60,0.3)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cursorX, GRID_TOP - 30); ctx.lineTo(cursorX, GRID_TOP + VISIBLE_ROWS * CELL_H + 5); ctx.stroke();
  }

  ctx.restore();

  // Flash
  if (flashAlpha > 0) {
    ctx.globalAlpha = flashAlpha; ctx.fillStyle = flashColor; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x + shakeX, p.y + shakeY, Math.max(0.5, p.sz * p.life), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Feedbacks
  for (const f of feedbacks) {
    ctx.globalAlpha = Math.min(1, Math.max(0, f.life));
    ctx.font = 'bold 18px -apple-system, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // Progress bar
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  ctx.fillRect(W/2 - 100, H - 10, 200, 4);
  ctx.fillStyle = '#ffd700';
  ctx.fillRect(W/2 - 100, H - 10, 200 * (globalRep / TOTAL_REPS), 4);

  // Done
  if (state === 'done') {
    ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = '26px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('矿井结束', W/2, H/2 - 50);
    ctx.font = '22px sans-serif'; ctx.fillStyle = '#ffd700'; ctx.fillText(`总分: ${score}`, W/2, H/2 - 10);
    const maxDepth = Math.max(...columns.map(c => c.depth));
    ctx.font = '15px sans-serif'; ctx.fillStyle = '#aaa'; ctx.fillText(`最深: ${maxDepth} 层`, W/2, H/2 + 20);
    const grade = score >= 500 ? 'S' : score >= 350 ? 'A' : score >= 200 ? 'B' : 'C';
    const gc = score >= 500 ? '#ffd700' : score >= 350 ? '#7aff7a' : score >= 200 ? '#88aaff' : '#aaa';
    ctx.font = 'bold 40px sans-serif'; ctx.fillStyle = gc; ctx.fillText(grade, W/2, H/2 + 70);
    ctx.font = '13px sans-serif'; ctx.fillStyle = '#888'; ctx.fillText('点击重玩', W/2, H/2 + 100);
  }
}

function loop() { update(); render(); requestAnimationFrame(loop); }

function handleInput() {
  if (state === 'done') {
    globalRep = 0; score = 0; cursorX = W/2; cursorDir = 1;
    initColumns(); particles = []; feedbacks = [];
    state = 'play'; repActive = true; struck = false; repTimer = 0;
    updateHUD(); return;
  }
  strike();
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleInput(); } });
canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); });

document.getElementById('go-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('start-overlay').style.display = 'none';
  state = 'play';
  initColumns();
  repActive = true; struck = false; repTimer = 0;
  updateHUD();
  loop();
});
</script>
</body>
</html>
